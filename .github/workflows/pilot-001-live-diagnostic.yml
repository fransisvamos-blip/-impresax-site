name: Pilot 001 Live Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pilot-001-live-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect live endpoints
        run: |
          set -euo pipefail
          echo "=== ROOT ==="
          curl -sS -D - -o /tmp/root https://impresax.org/ | sed -n '1,40p'
          echo "=== TENANT ==="
          curl -sS -D - -o /tmp/tenant https://studiodentisticogiardinelli.impresax.org/ | sed -n '1,60p'
          echo "=== UNKNOWN ==="
          curl -sS -D - -o /tmp/unknown https://factory-unknown-test.impresax.org/ | sed -n '1,60p'
          echo "=== TENANT BODY TITLE ==="
          grep -o '<title>[^<]*</title>' /tmp/tenant || true
