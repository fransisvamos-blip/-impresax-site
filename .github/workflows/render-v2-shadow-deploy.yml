name: Rendering V2 Shadow Deploy

on:
  workflow_run:
    workflows: ["Rendering V2 Shadow Check"]
    types: [completed]
    branches: [rendering-v2-shadow]
  workflow_dispatch:

concurrency:
  group: rendering-v2-shadow-deploy
  cancel-in-progress: true

jobs:
  deploy-shadow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'rendering-v2-shadow' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deploy V2 shadow
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.render-v2.jsonc 2>&1 | tee /tmp/v2-deploy.log
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/v2-deploy.log | tail -1 || true)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Core health check
        shell: bash
        env:
          V2_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in {1..12}; do
            code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 6 --max-time 10 "$V2_URL/healthz" || true)
            if [ "$code" = "200" ]               && grep -q '"mode":"SHADOW"' /tmp/health.json               && grep -q '"engine":"RS_ENGINE_V2_13_R112_SECTION_SUBSTANCE"' /tmp/health.json               && grep -q '"quality_contract":"RS_QUALITY_V14_R112_SECTION_SUBSTANCE"' /tmp/health.json               && grep -q '"database_connected":true' /tmp/health.json               && grep -q '"operational_ok":true' /tmp/health.json               && grep -q '"r112_section_substance_contract_ok":true' /tmp/health.json               && grep -q '"delivery_mode":"SINGLE_CONCEPT"' /tmp/health.json               && grep -q '"browser":true' /tmp/health.json               && grep -q '"r2":true' /tmp/health.json; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1
