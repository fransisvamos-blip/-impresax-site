name: DEDIL R111 visual review artifacts

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-r111-visual-review-artifacts.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Fetch current R111 screenshots directly from private R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/A/r167/desktop-1440.jpg" --remote --file review/dedil-r111-desktop.jpg
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/A/r167/mobile-390.jpg" --remote --file review/dedil-r111-mobile.jpg
          file review/*
      - uses: actions/upload-artifact@v4
        with:
          name: dedil-r111-visual-review
          path: review/
          retention-days: 1
