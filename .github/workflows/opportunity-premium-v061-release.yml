name: ImpresaX Opportunity — V9.2 Warm Color Grade One-Time
# ONE-TIME owner-approved color correction; restore pause immediately after staged and production QA.
on:
  push:
    branches: [main]
    paths:
      - 'public/opportunita/.release-v092-warm-color-20261117'

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'push' }} # one-time user-authorized warm palette refinement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and local browser tester
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sharp playwright-core
      - name: Generate first-party sale-specific WhatsApp preview
        run: |
          node scripts/build-opportunity-share.mjs
          test -s public/opportunita/og-social-v8.jpg
          node -e "import('sharp').then(async({default:sharp})=>{const m=await sharp('public/opportunita/og-social-v8.jpg').metadata();if(m.width!==1200||m.height!==630||m.format!=='jpeg')process.exit(1);console.log('Social preview',m.width,m.height,m.format)})"
      - name: Verify new landing, backend contract and untouched ImpresaX render tests
        run: |
          node --test test/opportunita-landing.test.mjs
          node --test test/render-preview.test.mjs
          node --check scripts/qa-private-sale.mjs
      - name: BEFORE deploy - real Chromium nine-viewport layout and intercepted lead QA
        run: |
          set -euo pipefail
          python3 -m http.server 8191 --bind 127.0.0.1 --directory public/opportunita > /tmp/sale-preview-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          sleep 2
          curl -fsS --max-time 8 'http://127.0.0.1:8191/' >/dev/null
          QA_BASE_URL='http://127.0.0.1:8191/' node scripts/qa-private-sale.mjs
      - name: Deploy Owner-Requested PRIVATE SALE 09 High-Contrast Website
        id: production_deploy
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Smoke-test production, exact sale positioning, assets and privacy
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..9}; do
            html=$(curl -fsSL --max-time 18 'https://opportunita.impresax.org/' || true)
            if [[ "$html" == *'LOUNGE BAR'* ]] &&
               [[ "$html" == *'CEDESI'* ]] &&
               [[ "$html" == *'LOUNGE BAR'* ]] &&
               [[ "$html" == *'VENDITA O <em>GESTIONE?'* ]] &&
               [[ "$html" == *'family=DM+Sans:wght@400'* ]] &&
               [[ "$html" == *'family=Plus+Jakarta+Sans:wght@500'* ]] &&
               [[ "$html" == *'PRIVATE SALE 08 — CINEMATIC EDITORIAL'* ]] &&
               [[ "$html" == *'PRIVATE SALE 09 — HIGH-CONTRAST MODERN HOSPITALITY'* ]] &&
               [[ "$html" == *'PRIVATE SALE 09.2 — WARM LUXURY COLOR GRADE'* ]] &&
               [[ "$html" != *'PRIVATE SALE 08.1 — PRECISION POLISH'* ]] &&
               [[ "$html" == *'class="story-photo"'* ]] &&
               [[ "$html" == *'class="story-action"'* ]] &&
               [[ "$html" == *'class="proof-icon"'* ]] &&
               [[ "$html" != *'Cormorant+Garamond'* ]] &&
               [[ "$html" != *'Proposta di design dimostrativa'* ]] &&
               [[ "$html" == *'RICHIEDI I DETTAGLI DI VENDITA'* ]] &&
               [[ "$html" == *'og-social-v8.jpg'* ]] &&
               [[ "$html" == *"fetch('/api/interesse'"* ]] &&
               [[ "$html" == *'name="privacy_accepted"'* ]] &&
               [[ "$html" != *'Concept 06'* ]] &&
               [[ "$html" != *'300.000'* ]]; then
              ready=1; break
            fi
            sleep 5
          done
          test "$ready" = '1'
          for asset in 'hero-lounge-desktop-v1.webp' 'hero-lounge-mobile-v1.webp' 'story-serata-desktop-v2.webp' 'story-serata-mobile-v2.webp' 'og-social-v8.jpg'; do
            asset_ready=0
            for attempt in {1..12}; do
              code=$(curl -L -sS --max-time 20 -o "/tmp/$asset" -w '%{http_code}' "https://opportunita.impresax.org/$asset" || true)
              size=$(wc -c < "/tmp/$asset" 2>/dev/null || echo 0)
              echo "ASSET PROBE $asset attempt=$attempt code=$code bytes=$size"
              if [[ "$code" == "200" ]] && (( size > 15000 )); then asset_ready=1; break; fi
              sleep 3
            done
            test "$asset_ready" = "1"
          done
          curl -fsSL --max-time 18 'https://opportunita.impresax.org/privacy' -o /tmp/opportunita-privacy-live.html
          grep -q 'Informativa sulla privacy' /tmp/opportunita-privacy-live.html
          node -e "import('sharp').then(async({default:sharp})=>{const m=await sharp('/tmp/og-social-v8.jpg').metadata();if(m.width!==1200||m.height!==630)process.exit(1);console.log('Live social',m.width,m.height)})"
          status=$(curl -sS --max-time 18 -o /tmp/private-sale-invalid.json -w '%{http_code}' -X POST 'https://opportunita.impresax.org/api/interesse' -H 'Content-Type: application/json' --data '{"full_name":"QA","phone":"000","transaction_interest":"cessione","privacy_accepted":false}')
          test "$status" = '422'
          grep -q '"error":"DATI_NON_VALIDI"' /tmp/private-sale-invalid.json
          echo 'Sale page, real assets, OG, privacy and non-writing invalid-lead rejection: PASS'
      - name: AFTER deploy - real Chromium nine-viewport QA with safe mocked leads
        run: |
          QA_BASE_URL='https://opportunita.impresax.org/' node scripts/qa-private-sale.mjs
      - name: Archive desktop and mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-sale-06-responsive-before-after
          path: /tmp/opportunita-private-sale06-qa/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Automatic rollback of opportunity page if production QA failed
        if: ${{ failure() && steps.production_deploy.outcome == 'success' }}
        run: |
          echo 'PRODUCTION QA FAILED: restoring approved previous landing automatically'
          cp backups/opportunita-v91-before-color-grade-20261117.html public/opportunita/index.html
          node scripts/build-opportunity-share.mjs
          npx wrangler deploy --config wrangler.jsonc
