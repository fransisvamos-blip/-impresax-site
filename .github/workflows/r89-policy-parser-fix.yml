name: R89 policy parser fix

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/r89-policy-parser-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped class selector line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/render-v2/showroom-policy.js")
          lines=p.read_text().splitlines()
          out=[]
          for line in lines:
              if "const esc=cls.replace" in line:
                  out.append('      const esc=cls.replace(/[^a-zA-Z0-9_-]/g,"");')
              else:
                  out.append(line)
          p.write_text("\n".join(out)+"\n")
          PY
      - name: Commit
        run: |
          git config user.name "ImpresaX Rendering Bot"
          git config user.email "rendering-bot@impresax.local"
          git add src/render-v2/showroom-policy.js
          git diff --cached --quiet || git commit -m "fix(render-v2): repair showroom surface selector parser"
          git push origin HEAD:rendering-v2-shadow
