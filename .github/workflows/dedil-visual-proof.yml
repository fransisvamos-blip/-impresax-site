name: DEDIL C585 Visual Proof

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-visual-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Fetch DEDIL screenshots from private R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dedil-visual-proof
          bucket="impresax-render-v2-shadow"
          npx wrangler r2 object get "$bucket/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/C/r585/desktop-1440.jpg" --file dedil-visual-proof/c585-desktop.jpg --remote
          npx wrangler r2 object get "$bucket/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/C/r585/mobile-390.jpg" --file dedil-visual-proof/c585-mobile.jpg --remote
          sha256sum dedil-visual-proof/*.jpg | tee dedil-visual-proof/SHA256SUMS.txt
          test "$(sha256sum dedil-visual-proof/c585-desktop.jpg | cut -d' ' -f1)" = "c552f4001647306993d98b70d77cb20e8b6db309555e0be8ebfe90af4c5e753e"
          test "$(sha256sum dedil-visual-proof/c585-mobile.jpg | cut -d' ' -f1)" = "04caa558fc4ca5a8864809cfa7b6c988b62b318979c9a45218a2786166a699cb"
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: dedil-c585-proof
          path: dedil-visual-proof/
          if-no-files-found: error
          retention-days: 1
