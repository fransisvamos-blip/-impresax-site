name: DEDIL C588 Visual Proof

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-visual-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Fetch DEDIL screenshots from private R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dedil-visual-proof
          bucket="impresax-render-v2-shadow"
          npx wrangler r2 object get "$bucket/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/C/r588/desktop-1440.jpg" --file dedil-visual-proof/c588-desktop.jpg --remote
          npx wrangler r2 object get "$bucket/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/C/r588/mobile-390.jpg" --file dedil-visual-proof/c588-mobile.jpg --remote
          sha256sum dedil-visual-proof/*.jpg | tee dedil-visual-proof/SHA256SUMS.txt
          test "$(sha256sum dedil-visual-proof/c588-desktop.jpg | cut -d' ' -f1)" = "f4cc52c484e4eff1bf3050fd7409c8f89831286da449df4b90492c28fd0fe6f0"
          test "$(sha256sum dedil-visual-proof/c588-mobile.jpg | cut -d' ' -f1)" = "4c196b02cf0ae5a39987a56d3de916a38ba33a60ffb2bb0f3bfb19219a68d605"
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: dedil-c588-proof
          path: dedil-visual-proof/
          if-no-files-found: error
          retention-days: 1
