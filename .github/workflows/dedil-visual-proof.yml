name: DEDIL R107 Diagnostics Proof

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-visual-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Fetch DEDIL R107 diagnostics from private R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dedil-r107-diagnostics
          bucket="impresax-render-v2-shadow"
          npx wrangler r2 object get "$bucket/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/B/r90/browser-diagnostics.json" --file dedil-r107-diagnostics/b90.json --remote
          npx wrangler r2 object get "$bucket/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/C/r601/browser-diagnostics.json" --file dedil-r107-diagnostics/c601.json --remote
          cat dedil-r107-diagnostics/b90.json
          cat dedil-r107-diagnostics/c601.json
      - name: Upload R107 diagnostics proof
        uses: actions/upload-artifact@v4
        with:
          name: dedil-r107-diagnostics
          path: dedil-r107-diagnostics/
          if-no-files-found: error
          retention-days: 1
