name: V2 CZ063 B C Grammar V13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-cz063-bc-v13.yml'
  workflow_dispatch:

jobs:
  relaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
      PACK_ID: 8595c9d2-9d53-424b-a660-82102b9db5b3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Relaunch only B and C on grammar v1.3
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          for variant in B C; do
            ok=0
            run_key="grammar-v13-${variant,,}"
            for i in {1..20}; do
              code=$(curl -sS -o "/tmp/relaunch-${variant}.json" -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H "Content-Type: application/json" \
                --data "{\"pack_id\":\"$PACK_ID\",\"variant_key\":\"$variant\",\"run_key\":\"$run_key\"}" \
                "$V2_URL/shadow/relaunch-variant" || true)
              echo "variant=$variant attempt=$i code=$code body=$(cat /tmp/relaunch-${variant}.json 2>/dev/null || true)"
              if [ "$code" = "202" ] || [ "$code" = "200" ]; then ok=1; break; fi
              sleep 4
            done
            [ "$ok" = "1" ] || exit 1
            jq -e '.ok == true' "/tmp/relaunch-${variant}.json" >/dev/null
          done
          echo "B/C relaunched on ZERO_PHOTO_PREMIUM_GRAMMAR_V1.3; A preserved." >> "$GITHUB_STEP_SUMMARY"
