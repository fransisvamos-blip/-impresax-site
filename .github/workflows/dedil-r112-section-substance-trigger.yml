name: DEDIL R112 section-substance trigger

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-r112-section-substance-trigger.yml"

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-8595c9d2-9d53-424b-a660-82102b9db5b3-A-r112-section-substance-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deploy latest R112 worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.render-v2.jsonc
      - name: Trigger DEDIL R112
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"1695ca34-83ba-4752-998c-023702ceab42","packId":"8595c9d2-9d53-424b-a660-82102b9db5b3","inputPackId":"0db11b64-b638-4dff-90fd-41b132c309af","variantId":"1f5af9d8-c9a8-4659-b389-84b9cc7f528d","variantKey":"A","parentInstanceId":"rpv2-8595c9d2-9d53-424b-a660-82102b9db5b3","eventPrefix":"dedil-r112-section-substance-v1","initialFeedback":{"reason":"ENGINE_CONTRACT_UPGRADE","issues":["R111 fixed homepage length but middle-scroll substance is still insufficient for 10K-15K perceived value.","Why-us must contain 4-6 verified reasons with visible proof support and strong graphic composition.","Editorial features must be content-rich, sector-specific and materially different, with no oversized empty stages.","Bridge and final CTA must have distinct commercial jobs and cannot repeat the same actions.","Mobile must retain premium information density with no long dead zones."],"actions":["Keep the approved hero locked.","Use R111 depth plus R112 section-substance as blocking source of truth.","Use verified services, operations, locality, applications and capabilities to build rich middle-scroll scenes.","Keep U-Power entirely separate in Marchi e partnership with verified official logo.","Bridge uses the secondary action; final CTA uses only the primary conversion action.","Reject decorative-only sections and large empty areas.","Keep external AI disabled."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json
      - name: Wait for R112 render
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json > /tmp/status.json
            cat /tmp/status.json
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"complete"' /tmp/status.json; then exit 0; fi
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"(errored|terminated)"' /tmp/status.json; then exit 1; fi
            sleep 4
          done
          exit 1
