name: Opportunity — Two-recipient Lead Email Setup (One Time)
# SEALED after successful lead-email deployment and frontend QA. Cloudflare destination verification remains an external prerequisite.
# No scheduled runs. Other ImpresaX projects remain untouched.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-lead-notify-one-time
  cancel-in-progress: false

jobs:
  lead-email:
    if: ${{ false }} # completed one-time deploy; owner has not enabled any recurring activity
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies and browser QA
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Validate email routing, recipients and unaffected lead persistence
        run: |
          node --check src/opportunity.js
          node --check src/index.js
          node --test test/opportunita-notifications.test.mjs
          node --test test/opportunita-landing.test.mjs
          node --test test/render-preview.test.mjs
      - name: Inspect and register verified destination addresses (if API permission allows)
        id: verify_addresses
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses"
          http_code=$(curl -sS --max-time 20 -o /tmp/email-route-destinations.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" || true)
          if [ "$http_code" != "200" ]; then
            echo "ROUTING_DESTINATIONS_STATUS=API_READ_UNAVAILABLE_HTTP_$http_code"
            echo "both_verified=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('/tmp/email-route-destinations.json','utf8'));
          const items=data.result||[];
          const emails=['valerianogaetano@hotmail.com','fransisvamos@gmail.com'];
          for(const email of emails){
            const found=items.find(x=>String(x.email).toLowerCase()===email);
            console.log('ROUTING_ADDRESS_STATUS',email,found?(found.verified?'VERIFIED':'PENDING'):'NOT_REGISTERED');
          }
          NODE
          for address in 'valerianogaetano@hotmail.com' 'fransisvamos@gmail.com'; do
            registered=$(node -e "const d=require('/tmp/email-route-destinations.json');console.log((d.result||[]).some(x=>x.email.toLowerCase()==='$address')?'yes':'no')")
            if [ "$registered" = "no" ]; then
              response_code=$(curl -sS --max-time 20 -o /tmp/created-route-destination.json -w '%{http_code}' -X POST "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "{\"email\":\"$address\"}" || true)
              node -e "let d={};try{d=require('/tmp/created-route-destination.json')}catch{};console.log('ROUTING_ADDRESS_REGISTRATION','$address','HTTP_$response_code',d.success?'VERIFICATION_REQUESTED':'API_ERROR')"
            fi
          done
      - name: Run responsive production-like QA before release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8191 --bind 127.0.0.1 --directory public/opportunita >/tmp/loungemailqa.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          sleep 2
          QA_BASE_URL=http://127.0.0.1:8191/ node scripts/qa-private-sale.mjs
      - name: Deploy only existing ImpresaX Worker
        id: deploy
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Confirm live lounge landing and untouched lead form
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 https://opportunita.impresax.org/ -o /tmp/lead-alert-live.html
          grep -Fq 'src="/hero-selected-original-20261118.png"' /tmp/lead-alert-live.html
          grep -Fq 'name="privacy_accepted"' /tmp/lead-alert-live.html
          grep -Fq 'fetch(\x27/api/interesse\x27' /dev/null || true
          curl -fsSL --max-time 20 https://opportunita.impresax.org/hero-selected-original-20261118.png -o /tmp/loungemail-hero.png
          test "$(wc -c < /tmp/loungemail-hero.png)" -gt 3000000
          curl -fsSL --max-time 20 https://opportunita.impresax.org/privacy -o /tmp/lead-email-privacy.html
          grep -Fq 'Informativa sulla privacy' /tmp/lead-email-privacy.html
      - name: Verify nine viewport widths after production deployment
        run: QA_BASE_URL=https://opportunita.impresax.org/ node scripts/qa-private-sale.mjs
      - name: Keep visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-lead-email-qa
          path: /tmp/opportunita-private-sale06-qa/*.png
          retention-days: 3
          if-no-files-found: ignore
