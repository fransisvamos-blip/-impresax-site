name: V2 DEDIL A Logo First Master V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-dedil-a-logo-first-master-v1-20261016.yml'
  workflow_dispatch:

jobs:
  relaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
      PACK_ID: 8595c9d2-9d53-424b-a660-82102b9db5b3
      RUN_KEY: dedil-a-logo-first-wow-v5-premium-sections-20261017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Relaunch DEDIL A logo-first only
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          body=$(jq -nc --arg pack "$PACK_ID" --arg key "$RUN_KEY"             '{pack_id:$pack,variant_key:"A",run_key:$key,force:true,reset_budget:true,event_prefix:"logo-first-wow-v5",reason:"PILOT_LAYOUT_MICROPOLISH_REUSE_HERO"}')
          ok=0
          for i in {1..20}; do
            code=$(curl -sS -o /tmp/relaunch.json -w '%{http_code}'               -H "Authorization: Bearer $token"               -H "Content-Type: application/json"               --data "$body"               "$V2_URL/shadow/relaunch-variant" || true)
            echo "attempt=$i code=$code body=$(cat /tmp/relaunch.json 2>/dev/null || true)"
            if [ "$code" = "202" ] || [ "$code" = "200" ]; then ok=1; break; fi
            if [ "$code" != "401" ] && [ "$code" != "503" ]; then break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || exit 1
          jq -e '.ok == true and .pack_id == env.PACK_ID and .variant_key == "A"' /tmp/relaunch.json >/dev/null
