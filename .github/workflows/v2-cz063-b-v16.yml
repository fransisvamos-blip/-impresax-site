name: V2 CZ063 B Trust V23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-cz063-b-v16.yml'
  workflow_dispatch:

jobs:
  relaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
      PACK_ID: 8595c9d2-9d53-424b-a660-82102b9db5b3
      FINALIZER_ID: rpv2-finalize-8595c9d2-9d53-424b-a660-82102b9db5b3-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Replace B set1 with trust-first industrial poster
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "impresax-v2-control-v1:${CLOUDFLARE_API_TOKEN}" | sha256sum | awk '{print $1}')
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          ok=0
          for i in {1..20}; do
            code=$(curl -sS -o /tmp/relaunch-b.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data "{\"pack_id\":\"$PACK_ID\",\"variant_key\":\"B\",\"run_key\":\"trust-v23-b\",\"force\":true,\"reset_budget\":true,\"reset_budget\":true,\"event_prefix\":\"initial\",\"reason\":\"SET_DIVERSITY_TRUST_FIRST_REBUILD\"}" \
              "$V2_URL/shadow/relaunch-variant" || true)
            echo "attempt=$i code=$code body=$(cat /tmp/relaunch-b.json 2>/dev/null || true)"
            if [ "$code" = "202" ] || [ "$code" = "200" ]; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" = "1" ] || exit 1
          jq -e '.ok == true' /tmp/relaunch-b.json >/dev/null
          echo "B relaunched on trust-first industrial poster v1.9 with bounded QA and isolated budget epoch; A/C preserved." >> "$GITHUB_STEP_SUMMARY"
