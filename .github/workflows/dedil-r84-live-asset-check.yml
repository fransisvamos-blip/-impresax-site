name: DEDIL r84 Live Asset Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dedil-r84-live-asset-check.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify r84 desktop and mobile assets
        run: |
          set -euo pipefail
          base="https://admin.impresax.org/ops/render-v2-assets/92d60bda-0ac0-46cc-b236-6ba1e06fd211"
          d=$(curl -L -sS -o /tmp/d.jpg -w "%{http_code}" --connect-timeout 8 --max-time 20 "$base/desktop" || true)
          m=$(curl -L -sS -o /tmp/m.jpg -w "%{http_code}" --connect-timeout 8 --max-time 20 "$base/mobile" || true)
          echo "desktop=$d bytes=$(wc -c </tmp/d.jpg 2>/dev/null || echo 0)"
          echo "mobile=$m bytes=$(wc -c </tmp/m.jpg 2>/dev/null || echo 0)"
          test "$d" = "200"
          test "$m" = "200"
          test $(wc -c </tmp/d.jpg) -gt 100000
          test $(wc -c </tmp/m.jpg) -gt 50000
