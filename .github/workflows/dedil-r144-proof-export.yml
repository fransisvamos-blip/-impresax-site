name: DEDIL r144 visual proof export

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-r144-proof-export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Download r144 proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/proofs/dedil-r144
          base="impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/A/r144"
          npx wrangler r2 object get "$base/desktop-1440.jpg" --remote --file ops/proofs/dedil-r144/desktop-1440.jpg
          npx wrangler r2 object get "$base/mobile-390.jpg" --remote --file ops/proofs/dedil-r144/mobile-390.jpg
          test "$(sha256sum ops/proofs/dedil-r144/desktop-1440.jpg | cut -d' ' -f1)" = "3350da711e9cea97cf4b76d9c9901e9ff61ef92d413a8e2d641bc38114b6454d"
          test "$(sha256sum ops/proofs/dedil-r144/mobile-390.jpg | cut -d' ' -f1)" = "565766cf4c383be4924393ca2bd95acd98c3a121532ab151e0e7bb2276ee26d8"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          for src,dst,w,q in [
            ("ops/proofs/dedil-r144/desktop-1440.jpg","ops/proofs/dedil-r144/desktop-review.jpg",1050,84),
            ("ops/proofs/dedil-r144/mobile-390.jpg","ops/proofs/dedil-r144/mobile-review.jpg",390,86),
          ]:
              im=Image.open(src).convert("RGB")
              h=round(im.height*w/im.width)
              im.resize((w,h)).save(dst,"JPEG",quality=q,optimize=True)
          PY
      - name: Commit visual proof
        run: |
          set -euo pipefail
          git config user.name "ImpresaX Rendering Bot"
          git config user.email "rendering-bot@impresax.local"
          git add ops/proofs/dedil-r144
          git diff --cached --quiet || git commit -m "chore(render-v2): export DEDIL r144 visual proof"
          git push origin HEAD:rendering-v2-shadow
