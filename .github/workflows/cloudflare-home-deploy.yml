name: ImpresaX Home Direct Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/styles.css"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-home-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Detect deploy credential
        id: creds
        shell: bash
        env:
          TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_B: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "${TOKEN_A:-}" ]; then
            echo "name=CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${TOKEN_B:-}" ]; then
            echo "name=CF_API_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No supported Cloudflare API token secret is configured." >&2
          exit 1
      - name: Deploy Worker and static assets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: npx wrangler deploy
