name: DEDIL ingest U-Power logo

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-ingest-upower-logo.yml"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Download official U-Power logo
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 'https://a.storyblok.com/f/285625047486899/1230x511/eed5934aef/logo_workwear_black.png' -o /tmp/upower-logo.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('/tmp/upower-logo.png')
          b=p.read_bytes()
          print("SHA256="+hashlib.sha256(b).hexdigest())
          print("BYTES="+str(len(b)))
          print("SIGNATURE="+b[:8].hex())
          PY
      - name: Upload verified partner logo to R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/assets/partner-upower-logo.png" --remote --file /tmp/upower-logo.png
