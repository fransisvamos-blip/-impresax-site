name: Edil Service Talarico R107 Triple Visual Proof

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/edil-service-r107-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Fetch R107 screenshots from private R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p edil-service-r107-proof
          bucket="impresax-render-v2-shadow"
          base="$bucket/render-v2/CZ-077/fc876aaf-c8b5-4820-88c4-999997d1f029"
          npx wrangler r2 object get "$base/A/r3/desktop-1440.jpg" --file edil-service-r107-proof/A3-desktop.jpg --remote
          npx wrangler r2 object get "$base/A/r3/mobile-390.jpg" --file edil-service-r107-proof/A3-mobile.jpg --remote
          npx wrangler r2 object get "$base/B/r3/desktop-1440.jpg" --file edil-service-r107-proof/B3-desktop.jpg --remote
          npx wrangler r2 object get "$base/B/r3/mobile-390.jpg" --file edil-service-r107-proof/B3-mobile.jpg --remote
          npx wrangler r2 object get "$base/C/r3/desktop-1440.jpg" --file edil-service-r107-proof/C3-desktop.jpg --remote
          npx wrangler r2 object get "$base/C/r3/mobile-390.jpg" --file edil-service-r107-proof/C3-mobile.jpg --remote
          test "$(sha256sum edil-service-r107-proof/A3-desktop.jpg | cut -d' ' -f1)" = "1773bb02630d3a8fe99d2b6a9a4c839e4011003104426a611af40bede742aed9"
          test "$(sha256sum edil-service-r107-proof/A3-mobile.jpg | cut -d' ' -f1)" = "b24b1079ea640243bedd7d6701ef252dfd7497bc37ad5034434b2f8bafac7eb9"
          test "$(sha256sum edil-service-r107-proof/B3-desktop.jpg | cut -d' ' -f1)" = "4174b326a8490571e6f6c44e064652a74112fdaf32558ac159c7f9ccfa521b36"
          test "$(sha256sum edil-service-r107-proof/B3-mobile.jpg | cut -d' ' -f1)" = "45e6409fb739167aff8583492bfabe219f0afdded710e0fda899c2c71d45b9d0"
          test "$(sha256sum edil-service-r107-proof/C3-desktop.jpg | cut -d' ' -f1)" = "683df98879a9d7fdb50022daf46220a1e8d228cba28e1382b684affeded77635"
          test "$(sha256sum edil-service-r107-proof/C3-mobile.jpg | cut -d' ' -f1)" = "1c5a12a982aefda0f02e289bce90a79fabbab31efb76fcae78b478f11544ea85"
          sha256sum edil-service-r107-proof/*.jpg > edil-service-r107-proof/SHA256SUMS.txt
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: edil-service-r107-a3-b3-c3-proof
          path: edil-service-r107-proof/
          if-no-files-found: error
          retention-days: 1
