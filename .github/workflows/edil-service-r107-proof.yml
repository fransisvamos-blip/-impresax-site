name: Edil Service Talarico R107 Triple Visual Proof

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/edil-service-r107-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Fetch R107 screenshots from private R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p edil-service-r107-proof
          bucket="impresax-render-v2-shadow"
          base="$bucket/render-v2/CZ-077/fc876aaf-c8b5-4820-88c4-999997d1f029"
          npx wrangler r2 object get "$base/A/r1/desktop-1440.jpg" --file edil-service-r107-proof/A1-desktop.jpg --remote
          npx wrangler r2 object get "$base/A/r1/mobile-390.jpg" --file edil-service-r107-proof/A1-mobile.jpg --remote
          npx wrangler r2 object get "$base/B/r1/desktop-1440.jpg" --file edil-service-r107-proof/B1-desktop.jpg --remote
          npx wrangler r2 object get "$base/B/r1/mobile-390.jpg" --file edil-service-r107-proof/B1-mobile.jpg --remote
          npx wrangler r2 object get "$base/C/r1/desktop-1440.jpg" --file edil-service-r107-proof/C1-desktop.jpg --remote
          npx wrangler r2 object get "$base/C/r1/mobile-390.jpg" --file edil-service-r107-proof/C1-mobile.jpg --remote
          test "$(sha256sum edil-service-r107-proof/A1-desktop.jpg | cut -d' ' -f1)" = "fc8bb4422eda7f762ad2c510d763a6edd22d7473bf3165c92006e727935e817e"
          test "$(sha256sum edil-service-r107-proof/A1-mobile.jpg | cut -d' ' -f1)" = "d9286c746bdcadef4031593f242586bc78bf267b2fd194c02d8835b6e23dc75a"
          test "$(sha256sum edil-service-r107-proof/B1-desktop.jpg | cut -d' ' -f1)" = "3146c63d35d71c2df6b9e353899b8ae209a1b4ab160c515f7abd39a834a40c6c"
          test "$(sha256sum edil-service-r107-proof/B1-mobile.jpg | cut -d' ' -f1)" = "1cbed9d9e37b3cba5997c0735aa817535d7723ebd35e28dc7fa1064c88395834"
          test "$(sha256sum edil-service-r107-proof/C1-desktop.jpg | cut -d' ' -f1)" = "6ebdd55e5c439187afd60a3fab763c40abbcfcca91db70c79f4cad119307a27c"
          test "$(sha256sum edil-service-r107-proof/C1-mobile.jpg | cut -d' ' -f1)" = "c8c58c5f7c3fe65abbab775ddb33f8447840ab6beec7532f9f439bba304cd5c1"
          sha256sum edil-service-r107-proof/*.jpg > edil-service-r107-proof/SHA256SUMS.txt
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: edil-service-r107-a1-b1-c1-proof
          path: edil-service-r107-proof/
          if-no-files-found: error
          retention-days: 1
