name: Edil Service Talarico R107 Triple Visual Proof

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/edil-service-r107-proof.yml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Fetch R107 screenshots from private R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p edil-service-r107-proof
          bucket="impresax-render-v2-shadow"
          base="$bucket/render-v2/CZ-077/eda282cd-c5c1-4c9c-bb2b-b3973b748adf"
          npx wrangler r2 object get "$base/A/r1/desktop-1440.jpg" --file edil-service-r107-proof/A1-desktop.jpg --remote
          npx wrangler r2 object get "$base/A/r1/mobile-390.jpg" --file edil-service-r107-proof/A1-mobile.jpg --remote
          npx wrangler r2 object get "$base/B/r1/desktop-1440.jpg" --file edil-service-r107-proof/B1-desktop.jpg --remote
          npx wrangler r2 object get "$base/B/r1/mobile-390.jpg" --file edil-service-r107-proof/B1-mobile.jpg --remote
          npx wrangler r2 object get "$base/C/r2/desktop-1440.jpg" --file edil-service-r107-proof/C2-desktop.jpg --remote
          npx wrangler r2 object get "$base/C/r2/mobile-390.jpg" --file edil-service-r107-proof/C2-mobile.jpg --remote
          test "$(sha256sum edil-service-r107-proof/A1-desktop.jpg | cut -d' ' -f1)" = "cd818abb9b6d533358808a47f0b3da2fce6b34c23a078c543c2211308c4b9451"
          test "$(sha256sum edil-service-r107-proof/A1-mobile.jpg | cut -d' ' -f1)" = "6ab5f39fc8fd53d34b5f8428285d629dc43a2efd06a6047cc3511e43cd2b6fdc"
          test "$(sha256sum edil-service-r107-proof/B1-desktop.jpg | cut -d' ' -f1)" = "ca4579b06888a009b0ceadd685d8f25a3cb1d3003b3bebd6633a8be09b3ac0f0"
          test "$(sha256sum edil-service-r107-proof/B1-mobile.jpg | cut -d' ' -f1)" = "0ea45fc441a99a23ab438fa3418ca8c0908166462794eb6794265980c4c82e5b"
          test "$(sha256sum edil-service-r107-proof/C2-desktop.jpg | cut -d' ' -f1)" = "dd06c72952771d6f50a0377a29ee0d1de3ef18e7eb7a96fe3106815dcf07cc0f"
          test "$(sha256sum edil-service-r107-proof/C2-mobile.jpg | cut -d' ' -f1)" = "fc366f5eb8b6d106bfd71c33af523ed38f19cc62d60ea1250565233296d5681d"
          sha256sum edil-service-r107-proof/*.jpg > edil-service-r107-proof/SHA256SUMS.txt
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: edil-service-r107-a1-b1-c2-proof
          path: edil-service-r107-proof/
          if-no-files-found: error
          retention-days: 1
