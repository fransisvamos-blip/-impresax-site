name: Armònia R112 standard parent

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/armonia-r112-standard-parent.yml"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-prospect
      INSTANCE_ID: rpv2-49d871e1-e721-45c7-8a15-53d152e709cd-r112-raster-first-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deploy latest R112 worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.render-v2.jsonc
      - name: Best-effort terminate superseded Gualtieri test parent
        shell: bash
        run: |
          set +e
          npx wrangler workflows instances terminate impresax-render-v2-prospect rpv2-7ba0aa4c-5598-4ef8-a81e-6d9fd4e03ced-r112-direct-v1 --config wrangler.render-v2.jsonc --json
          exit 0
      - name: Trigger Armònia R112
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"675a9cb8-a9c4-4e68-89c5-e94cd87ae97a","packId":"49d871e1-e721-45c7-8a15-53d152e709cd","inputPackId":"d7820cec-e66a-41ae-851a-02a1f5dc4a1c"}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json
      - name: Wait for Armònia
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json > /tmp/status.json
            cat /tmp/status.json
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"complete"' /tmp/status.json; then exit 0; fi
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"(errored|terminated)"' /tmp/status.json; then exit 1; fi
            sleep 4
          done
          exit 1
