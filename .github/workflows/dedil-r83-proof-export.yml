name: DEDIL r84 proof export

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/dedil-r83-proof-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Download r84 proof images
        run: |
          set -euo pipefail
          mkdir -p ops/proofs/dedil-r84
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/A/r84/desktop-1440.jpg" --remote --file ops/proofs/dedil-r84/desktop-1440.jpg
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/A/r84/mobile-390.jpg" --remote --file ops/proofs/dedil-r84/mobile-390.jpg
          file ops/proofs/dedil-r84/*.jpg
      - name: Commit proof images
        run: |
          set -euo pipefail
          git config user.name "ImpresaX Rendering Bot"
          git config user.email "rendering-bot@impresax.local"
          git add ops/proofs/dedil-r84/desktop-1440.jpg ops/proofs/dedil-r84/mobile-390.jpg
          git diff --cached --quiet || git commit -m "chore(render-v2): export DEDIL r83 visual proof"
          git push origin HEAD:rendering-v2-shadow
