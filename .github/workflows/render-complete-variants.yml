name: Render complete variant pack

on:
  push:
    branches: [main]
    paths:
      - "ops/render-packs/**/render-ready.trigger"
      - ".github/workflows/render-complete-variants.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-complete-variants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find render-pack directories
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}"               | grep '^ops/render-packs/.*/render-ready\.trigger$'               | xargs -r -n1 dirname               | sort -u > /tmp/render_dirs.txt || true
          else
            find ops/render-packs -type f -name 'render-ready.trigger' -printf '%h\n' | sort -u > /tmp/render_dirs.txt
          fi

          echo "Render directories:"
          cat /tmp/render_dirs.txt || true

          if [ ! -s /tmp/render_dirs.txt ]; then
            echo "No render directories selected."
          fi

      - name: Validate source pack before rendering
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            for key in A B C; do
              test -s "$d/variant-$key.html"
            done
          done < /tmp/render_dirs.txt

      - name: Install headless renderer
        shell: bash
        run: npm install --no-save puppeteer-core@24

      - name: Render all A/B/C desktop + mobile in parallel
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const puppeteer = require('puppeteer-core');

          const dirs = fs.existsSync('/tmp/render_dirs.txt')
            ? fs.readFileSync('/tmp/render_dirs.txt','utf8').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)
            : [];

          if (!dirs.length) process.exit(0);

          async function renderOne(browser, file, output, width, height) {
            const page = await browser.newPage();
            await page.setViewport({width, height, deviceScaleFactor: 1});
            await page.goto(pathToFileURL(path.resolve(file)).href, {
              waitUntil: 'networkidle2',
              timeout: 60000
            });
            await page.evaluate(async () => {
              if (document.fonts && document.fonts.ready) await document.fonts.ready;
            });
            await new Promise(r=>setTimeout(r,800));
            await page.screenshot({path: output, fullPage: true, type:'png'});
            await page.close();
          }

          (async()=>{
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-gpu','--hide-scrollbars']
            });

            try {
              for (const dir of dirs) {
                const jobs = [];
                for (const key of ['A','B','C']) {
                  const html = path.join(dir, `variant-${key}.html`);
                  jobs.push(renderOne(browser, html, path.join(dir,`variant-${key}-desktop.png`), 1440, 900));
                  jobs.push(renderOne(browser, html, path.join(dir,`variant-${key}-mobile.png`), 390, 844));
                }
                await Promise.all(jobs);
              }
            } finally {
              await browser.close();
            }
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE

      - name: Build lightweight previews
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          dirs=[Path(x.strip()) for x in Path('/tmp/render_dirs.txt').read_text().splitlines() if x.strip()]
          for d in dirs:
              for key in ('A','B','C'):
                  desk=d/f'variant-{key}-desktop.png'
                  mob=d/f'variant-{key}-mobile.png'
                  im=Image.open(desk).convert('RGB')
                  w=900
                  h=round(im.height*w/im.width)
                  im.resize((w,h),Image.Resampling.LANCZOS).save(d/f'variant-{key}-desktop-preview.jpg','JPEG',quality=84,optimize=True,progressive=True)

                  im=Image.open(mob).convert('RGB')
                  w=390
                  h=round(im.height*w/im.width)
                  im.resize((w,h),Image.Resampling.LANCZOS).save(d/f'variant-{key}-mobile-preview.jpg','JPEG',quality=82,optimize=True,progressive=True)
          PY

      - name: Validate full variant pack
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            for key in A B C; do
              test -s "$d/variant-$key-desktop.png"
              test -s "$d/variant-$key-mobile.png"
            done
          done < /tmp/render_dirs.txt

      - name: Write canonical render manifest
        shell: bash
        run: |
          python <<'PY'
          import json, os, hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          repo=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ.get("GITHUB_REF_NAME","main")
          dirs=[Path(x.strip()) for x in Path('/tmp/render_dirs.txt').read_text().splitlines() if x.strip()]

          for d in dirs:
              prospect=d.parent.name
              version_text=d.name
              raw_base=f"https://raw.githubusercontent.com/{repo}/{branch}/{d.as_posix()}"
              variants=[]
              for key in ("A","B","C"):
                  html=d/f"variant-{key}.html"
                  html_sha=hashlib.sha256(html.read_bytes()).hexdigest()
                  variants.append({
                      "variant_key":key,
                      "name":f"Versione {key}",
                      "status":"RENDER_READY",
                      "desktop_render_url":f"{raw_base}/variant-{key}-desktop.png",
                      "mobile_render_url":f"{raw_base}/variant-{key}-mobile.png",
                      "desktop_preview_url":f"{raw_base}/variant-{key}-desktop-preview.jpg",
                      "mobile_preview_url":f"{raw_base}/variant-{key}-mobile-preview.jpg",
                      "html_source_url":f"{raw_base}/variant-{key}.html",
                      "html_sha256":html_sha
                  })

              manifest={
                  "schema":"IMPRESAX_RENDER_MANIFEST_V1",
                  "prospect_code":prospect,
                  "version":int(version_text[1:]) if version_text.startswith("v") else version_text,
                  "status":"RENDER_READY",
                  "generated_at":datetime.now(timezone.utc).isoformat(),
                  "variants":variants
              }
              (d/"render-manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Commit render pack + manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ImpresaX Rendering Studio"
          git config user.email "actions@users.noreply.github.com"

          while IFS= read -r d; do
            [ -z "$d" ] && continue
            git add "$d"/variant-*-desktop.png "$d"/variant-*-mobile.png                     "$d"/variant-*-desktop-preview.jpg "$d"/variant-*-mobile-preview.jpg                     "$d"/render-manifest.json
          done < /tmp/render_dirs.txt

          if git diff --cached --quiet; then
            echo "No render changes"
            exit 0
          fi

          git commit -m "Render complete A B C desktop mobile + manifest"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1


      - name: Sync canonical manifest into Gestionale
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            prospect="$(basename "$(dirname "$d")")"
            version_dir="$(basename "$d")"
            version="${version_dir#v}"
            echo "Syncing $prospect v$version"
            for i in 1 2 3 4 5; do
              if curl -fsS --connect-timeout 8 --max-time 30                 "https://admin.impresax.org/ops/render-sync?prospect=$prospect&version=$version"; then
                echo
                break
              fi
              sleep 4
              test "$i" != "5"
            done
          done < /tmp/render_dirs.txt
