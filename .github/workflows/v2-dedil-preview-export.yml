# export trigger: r49-visual-inspection-20261016
name: V2 DEDIL Preview Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-dedil-preview-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Export private preview images
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          mkdir -p /tmp/dedil-preview
          fetch_artifact() {
            id="$1"; out="$2"
            for i in {1..20}; do
              code=$(curl -sS -o "/tmp/dedil-preview/$out" -w '%{http_code}'                 -H "Authorization: Bearer $token"                 "$V2_URL/shadow/artifact/$id" || true)
              echo "artifact=$id attempt=$i code=$code"
              if [ "$code" = "200" ]; then return 0; fi
              if [ "$code" != "401" ] && [ "$code" != "503" ]; then return 1; fi
              sleep 3
            done
            return 1
          }
          fetch_artifact 8d6b2b68-d27d-494f-a742-5e26d7766316 desktop-1440.jpg
          fetch_artifact 8f829ff6-85e0-4ba9-bff3-ea8c7f67e376 mobile-390.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dedil-a-r49-preview
          path: /tmp/dedil-preview
          if-no-files-found: error
