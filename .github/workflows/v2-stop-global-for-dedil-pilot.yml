name: V2 Stop Global For DEDIL Pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-stop-global-for-dedil-pilot.yml'
  workflow_dispatch:

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Stop non-pilot active variants
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          for instance in \
            rpv2-finalize-8595c9d2-9d53-424b-a660-82102b9db5b3-8
          do
            ok=0
            for i in {1..20}; do
              body=$(jq -nc --arg id "$instance" '{workflow_instance_id:$id,action:"terminate"}')
              code=$(curl -sS -o /tmp/control.json -w '%{http_code}'                 -H "Authorization: Bearer $token"                 -H "Content-Type: application/json"                 --data "$body"                 "$V2_URL/shadow/control" || true)
              echo "instance=$instance attempt=$i code=$code body=$(cat /tmp/control.json 2>/dev/null || true)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              if [ "$code" != "401" ] && [ "$code" != "503" ]; then break; fi
              sleep 3
            done
            [ "$ok" = "1" ] || exit 1
          done
