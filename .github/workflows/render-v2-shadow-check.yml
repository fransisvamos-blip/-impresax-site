name: Rendering V2 Shadow Check

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - 'src/render-v2/**'
      - 'test/render-v2*.test.mjs'
      - 'test/fixtures/render-v2-golden-set.json'
      - 'scripts/render-v2-golden-input-audit.mjs'
      - 'wrangler.render-v2.jsonc'
      - 'ops/migrations/018_render_v2_shadow_foundation.sql'
      - 'ops/migrations/019_render_v2_invariants.sql'
      - 'ops/migrations/020_render_v2_input_truth_guards.sql'
      - 'ops/migrations/021_render_v2_component_hash_guards.sql'
      - 'ops/migrations/022_render_v2_durable_planning_idempotency.sql'
      - 'ops/migrations/023_render_v2_failure_idempotency.sql'
      - '.github/workflows/render-v2-shadow-check.yml'
  workflow_dispatch:

concurrency:
  group: rendering-v2-shadow-ci
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Contract tests
        run: node --test test/render-v2*.test.mjs
      - name: Cloudflare dry build
        run: npx wrangler deploy --dry-run --config wrangler.render-v2.jsonc --outdir dist-v2
      - name: Deploy V2 shadow
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.render-v2.jsonc 2>&1 | tee /tmp/v2-deploy.log
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/v2-deploy.log | tail -1 || true)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Core health check
        shell: bash
        env:
          V2_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in {1..12}; do
            code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 6 --max-time 10 "$V2_URL/healthz" || true)
            if [ "$code" = "200" ]               && grep -q '"mode":"SHADOW"' /tmp/health.json               && grep -q '"engine":"RS_ENGINE_V2_13_R112_SECTION_SUBSTANCE"' /tmp/health.json               && grep -q '"quality_contract":"RS_QUALITY_V14_R112_SECTION_SUBSTANCE"' /tmp/health.json               && grep -q '"database_connected":true' /tmp/health.json               && grep -q '"r112_section_substance_contract_ok":true' /tmp/health.json               && grep -q '"delivery_mode":"SINGLE_CONCEPT"' /tmp/health.json               && grep -q '"r119_fast_generative_reset":"R119_FAST_GENERATIVE_RESET_V3_CANONICAL_QA_IDEMPOTENCY"' /tmp/health.json               && grep -q '"browser":true' /tmp/health.json               && grep -q '"r2":true' /tmp/health.json; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1


      - name: One-shot DEDIL R121 v5 direct trigger
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID='rv2-38441f16-d2ff-48bb-bdc1-3520230548b9-A-dedil-r121-direct-v5'
          PARAMS='{"prospectId":"1695ca34-83ba-4752-998c-023702ceab42","packId":"38441f16-d2ff-48bb-bdc1-3520230548b9","inputPackId":"01a3d875-3007-4962-8fd4-a453e8fca48f","variantId":"23d69d20-3b20-4fd1-8ba4-e61f2a64f17c","variantKey":"A","parentInstanceId":"rpv2-38441f16-d2ff-48bb-bdc1-3520230548b9-dedil-plan-r119-v14","eventPrefix":"r121","initialFeedback":{"reason":"R121_CREATIVE_DIRECTOR_ENGINE_V1","issues":["Final R121 Creative Director pass for DEDIL only after hostile concept-jury rejection."],"actions":["Use the R121 Concept Director with maximum reasoning before code.","Build an ownable organizing idea from verified DEDIL specifics, especially rebar transformation, Catanzaro/Germaneto, verified scale and U-Power relationship.","Generate six materially different campaign visual modes under illustrative-not-documentary truth safety.","Keep mobile independently art-directed.","Do not weaken the sellability jury.","Do not start or mutate any other prospect."]}}'
          npx wrangler workflows trigger impresax-render-v2-variant "$PARAMS" \
            --id "$INSTANCE_ID" \
            --config wrangler.render-v2.jsonc
