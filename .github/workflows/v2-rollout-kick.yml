name: V2 Rollout Kick
# rollout kick trigger: instrumented-reconcile-20261016-1457

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-rollout-kick.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Kick autonomous rollout controller
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          reconcile_ok=0
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/reconcile.json -w '%{http_code}' -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{}' "$V2_URL/shadow/reconcile" || true)
            echo "reconcile_attempt=$i code=$code body=$(cat /tmp/reconcile.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then reconcile_ok=1; break; fi
            sleep 3
          done
          [ "$reconcile_ok" = "1" ] || exit 1
          jq -e '.ok == true' /tmp/reconcile.json >/dev/null

          ok=0
          for i in {1..20}; do
            code=$(curl -sS -o /tmp/tick.json -w '%{http_code}' -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{}' "$V2_URL/shadow/rollout/tick" || true)
            echo "tick_attempt=$i code=$code body=$(cat /tmp/tick.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" = "1" ] || exit 1
          jq -e '.ok == true' /tmp/tick.json >/dev/null
          echo "V2 reconcile + rollout controller kicked successfully." >> "$GITHUB_STEP_SUMMARY"
