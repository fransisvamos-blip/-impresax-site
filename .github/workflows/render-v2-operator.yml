name: Rendering V2 Operator

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - 'ops/render-v2-command.json'
      - '.github/workflows/render-v2-operator.yml'

concurrency:
  group: rendering-v2-operator
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Execute command
        shell: bash
        run: |
          set -euo pipefail
          file="ops/render-v2-command.json"
          action=$(jq -r '.action // "noop"' "$file")
          command_id=$(jq -r '.command_id // "unknown"' "$file")
          echo "command_id=$command_id action=$action"

          if [ "$action" = "noop" ]; then
            exit 0
          fi

          if [ "$action" = "terminate" ]; then
            workflow=$(jq -r '.workflow_name' "$file")
            instance=$(jq -r '.instance_id' "$file")
            npx wrangler workflows instances terminate "$workflow" "$instance" --config wrangler.render-v2.jsonc --json
            exit 0
          fi

          if [ "$action" = "trigger_parent" ]; then
            instance=$(jq -r '.instance_id' "$file")
            params=$(jq -c '.params' "$file")
            npx wrangler workflows trigger impresax-render-v2-prospect "$params" --id "$instance" --config wrangler.render-v2.jsonc --json
            exit 0
          fi

          if [ "$action" = "trigger_variant" ]; then
            instance=$(jq -r '.instance_id' "$file")
            params=$(jq -c '.params' "$file")
            npx wrangler workflows trigger impresax-render-v2-variant "$params" --id "$instance" --config wrangler.render-v2.jsonc --json
            exit 0
          fi

          echo "Unsupported action: $action"
          exit 1
