on:
  push:
    branches: [main]
    paths:
      - 'public/opportunita/.release-story-faceblur-v2b'

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.event_name == 'push' }} # one-time light face blur update
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build original-design white/navy/orange WhatsApp cover
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/build-opportunity-share.mjs
          test -s public/opportunita/og-social-v5.jpg
      - name: Import precisely face-blurred venue photo as first-party assets v2
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import {writeFile} from 'node:fs/promises';
          const urls=[
            'https://titanoautomotive.myshopify.com/cdn/shop/files/impresax-serata-privacy-soft-face-blur-20261115.jpg',
            'https://cdn.shopify.com/s/files/1/1025/0744/6616/files/impresax-serata-privacy-soft-face-blur-20261115.jpg?v=1794744343',
            'https://titanoautomotive.myshopify.com/cdn/shop/files/impresax-serata-volti-sfocati-v2-transfer.jpg',
            'https://cdn.shopify.com/s/files/1/1025/0744/6616/files/impresax-serata-volti-sfocati-v2-transfer.jpg?v=1794744086'
          ];
          let bytes=null;
          for(const url of urls){
            try{
              const res=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Safari/537.36','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'},redirect:'follow'});
              console.log('Transfer status:',res.status,new URL(url).hostname);
              if(res.ok&&res.headers.get('Content-Type')?.startsWith('image/')){bytes=Buffer.from(await res.arrayBuffer());break;}
            }catch(e){console.warn('Transfer option failed',String(e).slice(0,120));}
          }
          if(!bytes)throw new Error('No publicly accessible venue photo transfer URL');
          const m=await sharp(bytes).metadata();
          if(m.width!==1536||m.height!==1024||m.format!=='jpeg'||bytes.length<160000)throw new Error('Invalid image');
          await writeFile('public/opportunita/story-serata-locale-v2.jpg',bytes);
          await sharp(bytes).webp({quality:85,effort:5}).toFile('public/opportunita/story-serata-desktop-v2.webp');
          await sharp(bytes).resize({width:900,withoutEnlargement:true}).webp({quality:83,effort:5}).toFile('public/opportunita/story-serata-mobile-v2.webp');
          for(const p of ['locale-v2.jpg','desktop-v2.webp','mobile-v2.webp']){
            const path='public/opportunita/story-serata-'+p;
            const meta=await sharp(path).metadata();
            console.log('Updated story asset:',path,meta.width,meta.height,meta.format);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/opportunita/story-serata-locale-v2.jpg public/opportunita/story-serata-desktop-v2.webp public/opportunita/story-serata-mobile-v2.webp
          git commit -m "assets(opportunita): light localized face blur for venue evening photo"
          git push origin HEAD:main
      - name: Render preview contract test
        run: node --test test/render-preview.test.mjs
      - name: Test the lounge landing without browser credits
        run: |
          node --test test/opportunita-landing.test.mjs
          node --check scripts/qa-opportunity-layout.mjs
      - name: Deploy production worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify original V3.9 restored and matching WhatsApp image live
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            html=$(curl -fsSL --max-time 18 'https://opportunita.impresax.org/' || true)
            if [[ "$html" == *'REFERENCE V3'* ]] &&
               [[ "$html" == *'V3.9 — targeted polish'* ]] &&
               [[ "$html" == *'V3.11 MOBILE-ONLY FIT & FUNNEL'* ]] &&
               [[ "$html" == *'V3.12 READABILITY AUDIT'* ]] &&
               [[ "$html" == *'story-serata-desktop-v2.webp'* ]] &&
               [[ "$html" == *'Serata al locale · immagine rielaborata digitalmente'* ]] &&
               curl -fsS --max-time 20 'https://opportunita.impresax.org/story-serata-desktop-v2.webp' -o /tmp/story-serata-desktop-v2.webp &&
               test "$(wc -c </tmp/story-serata-desktop-v2.webp)" -gt 50000 &&
               [[ "$html" == *'hero-lounge-desktop-v1.webp'* ]] &&
               [[ "$html" == *'Immagine rielaborata digitalmente'* ]] &&
               curl -fsS --max-time 18 'https://opportunita.impresax.org/hero-lounge-desktop-v1.webp' -o /tmp/venue-hero-desktop.webp &&
               test "$(wc -c </tmp/venue-hero-desktop.webp)" -gt 60000 &&
               [[ "$html" == *'OPPORTUNITÀ IMPRENDITORIALE'* ]] &&
               [[ "$html" == *'MOVIDA UNIVERSITARIA'* ]] &&
               [[ "$html" == *'Con clientela fidelizzata'* ]] &&
               [[ "$html" == *'UNA PIAZZA CONSOLIDATA'* ]] &&
               [[ "$html" != *'PREMIUM EDITION V4'* ]] &&
               [[ "$html" == *'og-social-v5.jpg'* ]] &&
               [[ "$html" == *'RICHIEDI<br>I DETTAGLI.'* ]] &&
               [[ "$html" == *'CESSIONE O GESTIONE?'* ]] &&
               [[ "$html" == *'CATANZARO LIDO.'* ]] &&
               [[ "$html" == *"fetch('/api/interesse'"* ]] &&
               curl -fsS --max-time 18 'https://opportunita.impresax.org/og-social-v5.jpg' -o /tmp/opportunita-og-v5.jpg &&
               test "$(wc -c </tmp/opportunita-og-v5.jpg)" -gt 12000 &&
               curl -fsS --max-time 18 'https://opportunita.impresax.org/privacy' | grep -q 'Informativa sulla privacy'; then
              node -e "import('sharp').then(async({default:sharp})=>{const m=await sharp('/tmp/opportunita-og-v5.jpg').metadata();if(m.width!==1200||m.height!==630||m.format!=='jpeg')process.exit(1);console.log('OG',m.width,m.height,m.format)})"
              echo 'Approved V3.9 fully restored and matching 1200x630 OG card live'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Chromium visual QA at 320, 375, 390, 414, 430, 768, 1024 and 1440 pixels
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/qa-opportunity-layout.mjs
      - name: Keep visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-responsive-v312
          path: /tmp/opportunita-visual-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify validation-only POST does not insert a fake lead
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 18 -o /tmp/opportunita-invalid.json -w '%{http_code}' \
            -X POST 'https://opportunita.impresax.org/api/interesse' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"QA","phone":"000","email":"","transaction_interest":"cessione","privacy_accepted":false}')
          test "$status" = '422'
          grep -q '"error":"DATI_NON_VALIDI"' /tmp/opportunita-invalid.json
          echo 'Live invalid-lead rejection verified; no database write occurred'
