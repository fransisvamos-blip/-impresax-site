# ONE-TIME V4: explicit user-approved premium landing and WhatsApp preview; restore owner pause after release.
on:
  push:
    branches: [main]
    paths:
      - 'public/opportunita/.release-20261114-v4b'

jobs:
  deploy:
    if: ${{ github.event_name == 'push' }} # one-time release marker
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build first-party premium WhatsApp cover
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/build-opportunity-share.mjs
          test -s public/opportunita/og-social-v4.jpg
      - name: Render preview contract test
        run: node --test test/render-preview.test.mjs
      - name: Test the lounge landing without browser credits
        run: node --test test/opportunita-landing.test.mjs
      - name: Deploy production worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify premium V4 site, social JPEG and privacy live
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            html=$(curl -fsSL --max-time 18 'https://opportunita.impresax.org/' || true)
            if [[ "$html" == *'PREMIUM EDITION V4'* ]] &&
               [[ "$html" == *'og-social-v4.jpg'* ]] &&
               [[ "$html" == *'RICHIEDI<br>I DETTAGLI.'* ]] &&
               [[ "$html" == *'CESSIONE O GESTIONE?'* ]] &&
               [[ "$html" == *'CATANZARO LIDO.'* ]] &&
               [[ "$html" == *"fetch('/api/interesse'"* ]] &&
               curl -fsS --max-time 18 'https://opportunita.impresax.org/og-social-v4.jpg' -o /tmp/opportunita-og-v4.jpg &&
               test "$(wc -c </tmp/opportunita-og-v4.jpg)" -gt 12000 &&
               curl -fsS --max-time 18 'https://opportunita.impresax.org/privacy' | grep -q 'Informativa sulla privacy'; then
              node -e "import('sharp').then(async({default:sharp})=>{const m=await sharp('/tmp/opportunita-og-v4.jpg').metadata();if(m.width!==1200||m.height!==630||m.format!=='jpeg')process.exit(1);console.log('OG',m.width,m.height,m.format)})"
              echo 'Premium V4 and 1200x630 WhatsApp card live'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify validation-only POST does not insert a fake lead
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 18 -o /tmp/opportunita-invalid.json -w '%{http_code}' \
            -X POST 'https://opportunita.impresax.org/api/interesse' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"QA","phone":"000","email":"","transaction_interest":"cessione","privacy_accepted":false}')
          test "$status" = '422'
          grep -q '"error":"DATI_NON_VALIDI"' /tmp/opportunita-invalid.json
          echo 'Live invalid-lead rejection verified; no database write occurred'
