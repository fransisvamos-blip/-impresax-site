name: ImpresaX Ops Hotfix Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-hotfix-deploy.yml"
      - "src/**"
      - "public/admin/**"
      - "test/render-preview.test.mjs"
      - "wrangler.jsonc"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Render preview contract test
        run: node --test test/render-preview.test.mjs
      - name: Deploy production worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify Ops health
        run: |
          set -euo pipefail
          for i in {1..20}; do
            code=$(curl -L -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 8 --max-time 15 "https://admin.impresax.org/ops/healthz" || true)
            echo "attempt=$i code=$code"
            if [ "$code" = "200" ] && grep -q '"render_v2_admin_bridge":true' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          cat /tmp/health.json || true
          exit 1
