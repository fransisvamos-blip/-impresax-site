name: ImpresaX Ops Hotfix Deploy

# Owner pause 2026-11-04: workflow disabled, no automatic runs.
# OWNER PAUSE: no automatic runs after manual approved one-time release.
# OWNER PAUSE: no scheduled or push deployments after client-approved single release.
# OWNER PAUSE: ImpresaX deploy and scheduler disabled; one-time landing rebuild complete.
# OWNER PAUSE: all recurring or push-based ImpresaX deployments remain disabled.
# OWNER PAUSE: ImpresaX workflows remain off after one-time landing publication.
# OWNER PAUSE: all scheduled and push-triggered workflows disabled after one-time lounge-bar release.
# OWNER PAUSE: ImpresaX automatic runs remain disabled after approved lounge landing release.
# OWNER PAUSE: recurring/scheduled ImpresaX jobs remain disabled after landing release.
# OWNER PAUSE: all automatic ImpresaX deployments remain disabled after approved art-direction release.
# OWNER PAUSE: landing deployed; all ImpresaX automatic deployments stay disabled.
# OWNER PAUSE: art-direction release completed, automatic ImpresaX deployments remain disabled.
# OWNER PAUSE: exclusive editorial landing released. All ImpresaX automatic deployments remain disabled.
# OWNER PAUSE: Gallery 07 published; all automatic ImpresaX deployments remain disabled.
# OWNER PAUSE: Gallery 08 successfully released; no automatic ImpresaX deploys or recurring triggers.
# OWNER PAUSE: Atelier 01 published; automatic ImpresaX deploys and scheduled runs remain disabled.
# OWNER PAUSE: render-approved landing released; all automatic ImpresaX deployments remain disabled.
# OWNER PAUSE: final typography corrections live; ImpresaX automatic deployments remain disabled.
# OWNER PAUSE: Visual Enrichment V3 successfully published. ImpresaX automatic deploys remain disabled.
# OWNER PAUSE: faithful approved V3 reference deployed; all automatic ImpresaX workflows remain disabled.
# OWNER PAUSE: V3.1 visual refinement released; ImpresaX automatic deployments remain disabled.
# OWNER PAUSE: V3.2 released and verified; no automatic ImpresaX deployments.
# OWNER PAUSE: V3.3 conversion-focused landing released; no scheduled or push deployments.
# OWNER PAUSE: V3.4 premium landing refinements deployed and verified; no scheduled or push deployments.
# OWNER PAUSE: V3.5 early-form landing released, all ImpresaX deploy triggers disabled.
# OWNER PAUSE: block 02 V3.6 published and verified; no automatic or scheduled ImpresaX deploys.
# OWNER PAUSE: V3.7 heading corrections live, automatic ImpresaX deployments remain disabled.
# OWNER PAUSE: V3.8 full landing upgrade published and verified; no automatic ImpresaX deploys.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ false }} # owner pause
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Render preview contract test
        run: node --test test/render-preview.test.mjs
      - name: Test the lounge landing without browser credits
        run: node --test test/opportunita-landing.test.mjs
      - name: Deploy production worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify faithful V3 desktop and mobile layout live without browser credits
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if curl -fsSL --max-time 18 'https://opportunita.impresax.org/' -o /tmp/opportunita.html &&
               grep -q 'REFERENCE V3' /tmp/opportunita.html &&
               grep -q 'V3.1' /tmp/opportunita.html &&
               grep -q 'V3.2' /tmp/opportunita.html &&
               grep -q 'V3.3' /tmp/opportunita.html &&
               grep -q 'STRUCTURE V3.5' /tmp/opportunita.html &&
               grep -q 'BLOCK 02 / PREMIUM DECISION SYSTEM V3.6' /tmp/opportunita.html &&
               grep -q 'V3.8 — comprehensive' /tmp/opportunita.html &&
               grep -q 'class="form-section-label"' /tmp/opportunita.html &&
               grep -q 'class="form-next-step"' /tmp/opportunita.html &&
               grep -q 'id="story-heading">UN PERCORSO<br>GIÀ AVVIATO.' /tmp/opportunita.html &&
               grep -q 'IL PROSSIMO PASSO È TUO.' /tmp/opportunita.html &&
               grep -q 'Panorama illustrativo di Catanzaro Lido' /tmp/opportunita.html &&
               grep -q '<span class="hero-city-line">CATANZARO LIDO.</span>' /tmp/opportunita.html &&
               grep -q 'id="offer-heading">CESSIONE O GESTIONE?' /tmp/opportunita.html &&
               ! grep -q 'CESSIONE<br>O GESTIONE.' /tmp/opportunita.html &&
               grep -q 'VOGLIO<br>ACQUISTARE.' /tmp/opportunita.html &&
               grep -q 'VOGLIO<br>GESTIRE.' /tmp/opportunita.html &&
               grep -q 'class="offer-heading-row"' /tmp/opportunita.html &&
               grep -q 'class="offer-both" type="button" data-choice="entrambe"' /tmp/opportunita.html &&
               grep -q 'class="shell closing-cta"' /tmp/opportunita.html &&
               grep -q '<footer class="site-footer">' /tmp/opportunita.html &&
               grep -q 'il modulo è subito qui sotto' /tmp/opportunita.html &&
               grep -q 'class="hero-actions"' /tmp/opportunita.html &&
               grep -q 'class="hero-phone"' /tmp/opportunita.html &&
               grep -q 'min-height:56px;padding:16px 23px' /tmp/opportunita.html &&
               grep -q 'aria-label="Chiama il 329 458 2962"' /tmp/opportunita.html &&
               grep -q 'class="optional-email" id="optional-email"' /tmp/opportunita.html &&
               grep -q 'RICHIEDI I DETTAGLI' /tmp/opportunita.html &&
               grep -q 'PARLIAMONE<br>IN RISERVATEZZA.' /tmp/opportunita.html &&
               grep -q 'class="shell proposal-facts"' /tmp/opportunita.html &&
               grep -q '@media(max-width:670px)' /tmp/opportunita.html &&
               ! grep -q '@media(max-width:540px)' /tmp/opportunita.html &&
               grep -q 'aria-describedby="interest-help"' /tmp/opportunita.html &&
               grep -q "opportunita:funnel" /tmp/opportunita.html &&
               grep -q 'class="mobile-action"' /tmp/opportunita.html &&
               grep -q 'class="offer-card-art"' /tmp/opportunita.html &&
               grep -q 'srcset="https://images.unsplash.com/' /tmp/opportunita.html &&
               grep -q 'SETTE ANNI DICHIARATI' /tmp/opportunita.html &&
               grep -q 'IN CESSIONE O GESTIONE.' /tmp/opportunita.html &&
               grep -q 'class="offer-card offer-card--buy"' /tmp/opportunita.html &&
               grep -q 'class="offer-card offer-card--manage"' /tmp/opportunita.html &&
               grep -q 'class="contact-panel"' /tmp/opportunita.html &&
               grep -q 'id="transaction_interest" name="transaction_interest"' /tmp/opportunita.html &&
               grep -q 'id="lead-form"' /tmp/opportunita.html &&
               grep -q "fetch('/api/interesse'" /tmp/opportunita.html &&
               grep -q 'photo-1767878032664-cd1d61f0e076' /tmp/opportunita.html &&
               grep -q 'photo-1774806245018-a2bdd2eb620b' /tmp/opportunita.html &&
               grep -q '@media(max-width:670px)' /tmp/opportunita.html &&
               ! grep -q 'VISUAL ENRICHMENT V3' /tmp/opportunita.html &&
               curl -fsSL --max-time 18 'https://opportunita.impresax.org/privacy' -o /tmp/opportunita-privacy.html &&
               grep -q 'Informativa sulla privacy' /tmp/opportunita-privacy.html &&
               grep -q '14 novembre 2026' /tmp/opportunita-privacy.html &&
               grep -q 'Unsplash' /tmp/opportunita-privacy.html &&
               ! grep -q 'Wikimedia Commons' /tmp/opportunita-privacy.html; then
              echo 'V3 reference site and privacy confirmed live'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify validation-only POST does not insert a fake lead
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 18 -o /tmp/opportunita-invalid.json -w '%{http_code}' \
            -X POST 'https://opportunita.impresax.org/api/interesse' \
            -H 'Content-Type: application/json' \
            --data '{"full_name":"QA","phone":"000","email":"","transaction_interest":"cessione","privacy_accepted":false}')
          test "$status" = '422'
          grep -q '"error":"DATI_NON_VALIDI"' /tmp/opportunita-invalid.json
          echo 'Live invalid-lead rejection verified; no database write occurred'
