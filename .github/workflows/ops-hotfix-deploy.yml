name: ImpresaX Ops Hotfix Deploy

# Owner pause 2026-11-04: workflow disabled, no automatic runs.
# OWNER PAUSE: no automatic runs after manual approved one-time release.
# OWNER PAUSE: no scheduled or push deployments after client-approved single release.
# OWNER PAUSE: ImpresaX deploy and scheduler disabled; one-time landing rebuild complete.
# OWNER PAUSE: all recurring or push-based ImpresaX deployments remain disabled.
# OWNER PAUSE: ImpresaX workflows remain off after one-time landing publication.
# OWNER PAUSE: all scheduled and push-triggered workflows disabled after one-time lounge-bar release.
# OWNER PAUSE: ImpresaX automatic runs remain disabled after approved lounge landing release.
# OWNER PAUSE: recurring/scheduled ImpresaX jobs remain disabled after landing release.
# OWNER PAUSE: all automatic ImpresaX deployments remain disabled after approved art-direction release.
# OWNER PAUSE: landing deployed; all ImpresaX automatic deployments stay disabled.
# OWNER PAUSE: art-direction release completed, automatic ImpresaX deployments remain disabled.
# OWNER PAUSE: exclusive editorial landing released. All ImpresaX automatic deployments remain disabled.
# OWNER PAUSE: Gallery 07 published; all automatic ImpresaX deployments remain disabled.
# OWNER PAUSE: Gallery 08 successfully released; no automatic ImpresaX deploys or recurring triggers.
# OWNER PAUSE: Atelier 01 published; automatic ImpresaX deploys and scheduled runs remain disabled.
# OWNER PAUSE: render-approved landing released; all automatic ImpresaX deployments remain disabled.
# OWNER PAUSE: final typography corrections live; ImpresaX automatic deployments remain disabled.
# OWNER PAUSE: Visual Enrichment V3 successfully published. ImpresaX automatic deploys remain disabled.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ false }} # owner pause
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Render preview contract test
        run: node --test test/render-preview.test.mjs
      - name: Test the lounge landing without browser credits
        run: node --test test/opportunita-landing.test.mjs
      - name: Deploy production worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify Mediterranean render live (without TinyFish)
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if curl -fsSL --max-time 18 'https://opportunita.impresax.org/' -o /tmp/opportunita.html &&
               grep -q 'IN CESSIONE<br>O GESTIONE.' /tmp/opportunita.html &&
               grep -q -- '--orange:#ed7628' /tmp/opportunita.html &&
               grep -q 'MEDITERRANEAN EDITORIAL / CONVERSION DESIGN V2' /tmp/opportunita.html &&
               grep -q 'VISUAL ENRICHMENT V3' /tmp/opportunita.html &&
               grep -q 'class="visual-gallery"' /tmp/opportunita.html &&
               grep -q 'Beach_of_Catanzaro_Lido_17.jpg' /tmp/opportunita.html &&
               grep -q 'Tramonto_a_Catanzaro_Lido.JPG' /tmp/opportunita.html &&
               grep -q 'class="step-icon"' /tmp/opportunita.html &&
               grep -q 'prefers-reduced-motion:reduce' /tmp/opportunita.html &&
               grep -q 'class="heading-accent"' /tmp/opportunita.html &&
               ! grep -q 'Instrument+Serif' /tmp/opportunita.html &&
               ! grep -q '<em>' /tmp/opportunita.html &&
               grep -q 'id="wizard-step-two" hidden' /tmp/opportunita.html &&
               grep -q 'class="deal-sheet reveal-on-scroll"' /tmp/opportunita.html &&
               ! grep -q 'ATELIER 01' /tmp/opportunita.html &&
               curl -fsSL --max-time 18 'https://opportunita.impresax.org/privacy' -o /tmp/opportunita-privacy.html &&
               grep -q '13 novembre 2026' /tmp/opportunita-privacy.html; then
              echo 'APPROVED RENDER LIVE and privacy verified'
              exit 0
            fi
            sleep 5
          done
          exit 1
