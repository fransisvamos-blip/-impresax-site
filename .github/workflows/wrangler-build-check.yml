name: Wrangler Build Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrangler-build-check.yml"
      - "src/**"
      - "public/tenants/**"
      - "wrangler.jsonc"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
