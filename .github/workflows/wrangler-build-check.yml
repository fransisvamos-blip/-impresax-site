name: Wrangler Build Check

# Owner pause 2026-11-04: workflow disabled, no automatic runs.
on:
  workflow_dispatch:

jobs:
  build:
    if: ${{ false }} # Owner pause
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Render preview tests
        run: node --test test/render-preview.test.mjs
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
