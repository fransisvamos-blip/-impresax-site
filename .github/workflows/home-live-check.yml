name: ImpresaX Home Live Check

on:
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/styles.css"
      - "public/script.js"
      - "wrangler.jsonc"
      - ".github/workflows/home-live-check.yml"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify current Home reaches production
        shell: bash
        run: |
          set -euo pipefail
          url="https://impresax.org/"
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/home -D /tmp/home-headers -w "%{http_code}" --connect-timeout 8 --max-time 15 "$url" || true)
            echo "attempt=$i code=$code"
            if [ "$code" = "200" ]               && grep -q 'class="value-frame"' /tmp/home               && grep -q 'id="value-frame-lock"' /tmp/home               && grep -q 'styles.css?v=20261011-value-frame-lock' /tmp/home; then
              ok=1
              break
            fi
            sleep 10
          done
          echo "=== RESPONSE HEADERS ==="
          cat /tmp/home-headers || true
          echo "=== VALUE CHECK MARKERS ==="
          grep -o 'class="value-frame"' /tmp/home || true
          grep -o 'id="value-frame-lock"' /tmp/home || true
          grep -o 'styles.css?v=20261011-value-frame-lock' /tmp/home || true
          test "$ok" = "1"

      - name: Verify stylesheet contains structural frame
        shell: bash
        run: |
          set -euo pipefail
          css="https://impresax.org/styles.css?v=20261011-value-frame-lock"
          code=$(curl -L -sS -o /tmp/styles -D /tmp/css-headers -w "%{http_code}" --connect-timeout 8 --max-time 15 "$css" || true)
          echo "css_code=$code"
          cat /tmp/css-headers || true
          test "$code" = "200"
          grep -q 'BLOCK 03 STRUCTURAL FRAME V2' /tmp/styles
          grep -q 'FINAL ANALYSIS DEPTH TUNING + DIAGNOSIS HANDOFF V1' /tmp/styles
          grep -q 'translateZ(74px)' /tmp/styles
          grep -q 'scale(1.04)' /tmp/styles
          grep -q 'FINAL ANALYSIS CRISP RENDER V1' /tmp/styles
          grep -q 'DESKTOP NAV REFINEMENT V2 + FINAL FORM TYPOGRAPHY V2' /tmp/styles
          grep -q 'transform:translateY(-16px)' /tmp/styles

      - name: Verify Block 06 real premium photography
        shell: bash
        run: |
          set -euo pipefail
          home="https://impresax.org/"
          curl -L -sS --connect-timeout 8 --max-time 20 "$home" -o /tmp/block06-home

          grep -q 'photos/3951656/pexels-photo-3951656.jpeg' /tmp/block06-home
          grep -q 'photos/15319245/pexels-photo-15319245.jpeg' /tmp/block06-home
          grep -q 'photos/5816285/pexels-photo-5816285.jpeg' /tmp/block06-home
          grep -q 'photos/8111889/pexels-photo-8111889.jpeg' /tmp/block06-home
          grep -q 'photos/29945075/pexels-photo-29945075.jpeg' /tmp/block06-home
          grep -q 'w=1800&q=92' /tmp/block06-home

          urls=(
            "https://images.pexels.com/photos/3951656/pexels-photo-3951656.jpeg?auto=compress&cs=tinysrgb&w=1800&q=92"
            "https://images.pexels.com/photos/15319245/pexels-photo-15319245.jpeg?auto=compress&cs=tinysrgb&w=1800&q=92"
            "https://images.pexels.com/photos/5816285/pexels-photo-5816285.jpeg?auto=compress&cs=tinysrgb&w=1800&q=92"
            "https://images.pexels.com/photos/8111889/pexels-photo-8111889.jpeg?auto=compress&cs=tinysrgb&w=1800&q=92"
            "https://images.pexels.com/photos/29945075/pexels-photo-29945075.jpeg?auto=compress&cs=tinysrgb&w=1800&q=92"
          )

          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            code=$(curl -L -sS -o /tmp/block06-real-$i.jpg -w "%{http_code}" --connect-timeout 8 --max-time 30 "$url" || true)
            echo "photo $i => $code"
            test "$code" = "200"
            test -s /tmp/block06-real-$i.jpg
          done

      - name: Verify Business Check to Analysis handoff
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/script -w "%{http_code}" --connect-timeout 8 --max-time 15 "https://impresax.org/script.js" || true)
          echo "script_code=$code"
          test "$code" = "200"
          grep -q 'function handoffDiagnosisToAnalysis' /tmp/script
          grep -q 'showStep(1,false)' /tmp/script
          grep -q 'diagnostic_to_analysis' /tmp/script


# BLOCK06_ASSET_CHECK_V1_RECHECK
