name: One-shot DEDIL showroom v3 terminate

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/dedil-showroom-v2-terminate.yml'

permissions:
  contents: read

jobs:
  terminate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Terminate superseded DEDIL showroom v3
        run: |
          set -euo pipefail
          npx wrangler workflows instances terminate impresax-render-v2-variant rv2-8595c9d2-9d53-424b-a660-82102b9db5b3-A-showroom-wow-v3 --config wrangler.render-v2.jsonc
