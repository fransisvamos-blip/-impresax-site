name: Pilot 001 QA

on:
  push:
    branches: [main]
    paths:
      - "public/tenants/studiodentisticogiardinelli/**"
      - "src/index.js"
      - "src/tenant-registry.js"
      - ".github/workflows/pilot-001-qa.yml"
      - "tests/pilot-001.spec.mjs"
      - "tests/pilot-001-live.spec.mjs"
      - "tests/serve-static.mjs"
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Pilot 001 viewport QA
        run: npx playwright test tests/pilot-001.spec.mjs --reporter=line
      - name: Live tenant smoke test
        run: |
          set -euo pipefail
          if grep -q 'visual_quality_status: "REWORK"' src/tenant-registry.js; then
            echo "Reference-lock V4 is in internal REWORK; live tenant intentionally gated until visual QA passes."
            exit 0
          fi
          tenant="https://studiodentisticogiardinelli.impresax.org/"
          root="https://impresax.org/"
          unknown="https://factory-unknown-test.impresax.org/"
          ok=0
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/tenant-body -D /tmp/tenant-headers -w "%{http_code}" "$tenant" || true)
            if [ "$code" = "200" ] && grep -qi "X-ImpresaX-Tenant: studiodentisticogiardinelli" /tmp/tenant-headers; then
              ok=1
              break
            fi
            echo "Tenant not live yet (attempt $i/18, HTTP $code); retrying..."
            sleep 10
          done
          test "$ok" = "1"
          grep -qi "X-Robots-Tag: noindex" /tmp/tenant-headers
          grep -q "Studio Dentistico Dott. Francesco Giardinelli" /tmp/tenant-body
          css_code=$(curl -sS -o /tmp/tenant-css -D /tmp/css-headers -w "%{http_code}" "https://studiodentisticogiardinelli.impresax.org/tenants/studiodentisticogiardinelli/styles.css")
          test "$css_code" = "200"
          grep -qi "Content-Type: text/css" /tmp/css-headers
          grep -q -- "--cream:#f3eee6" /tmp/tenant-css
          root_code=$(curl -sS -o /tmp/root-body -w "%{http_code}" "$root")
          test "$root_code" = "200"
          unknown_code=$(curl -sS -o /dev/null -D /tmp/unknown-headers -w "%{http_code}" "$unknown")
          test "$unknown_code" = "302"
          grep -qi "Location: https://impresax.org/" /tmp/unknown-headers
      - name: Run real post-live viewport QA
        run: npx playwright test tests/pilot-001-live.spec.mjs --reporter=line
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-001-qa-screenshots
          path: |
            test-results/screenshots
            test-results/live-screenshots
          if-no-files-found: ignore
