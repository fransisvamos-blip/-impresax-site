name: DEDIL triple-variant proof export

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-r94-proof-export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Download B and C proofs
        run: |
          set -euo pipefail
          mkdir -p ops/proofs/dedil-b-r74 ops/proofs/dedil-c-r582
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/B/r74/desktop-1440.jpg" --remote --file ops/proofs/dedil-b-r74/desktop-1440.jpg
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/B/r74/mobile-390.jpg" --remote --file ops/proofs/dedil-b-r74/mobile-390.jpg
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/C/r582/desktop-1440.jpg" --remote --file ops/proofs/dedil-c-r582/desktop-1440.jpg
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/C/r582/mobile-390.jpg" --remote --file ops/proofs/dedil-c-r582/mobile-390.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          jobs=[
            ("ops/proofs/dedil-b-r74/desktop-1440.jpg","ops/proofs/dedil-b-r74/desktop-review.jpg",1050,80),
            ("ops/proofs/dedil-b-r74/mobile-390.jpg","ops/proofs/dedil-b-r74/mobile-review.jpg",390,82),
            ("ops/proofs/dedil-c-r582/desktop-1440.jpg","ops/proofs/dedil-c-r582/desktop-review.jpg",1050,80),
            ("ops/proofs/dedil-c-r582/mobile-390.jpg","ops/proofs/dedil-c-r582/mobile-review.jpg",390,82),
          ]
          for src,dst,w,q in jobs:
              im=Image.open(src).convert("RGB")
              h=round(im.height*w/im.width)
              im.resize((w,h)).save(dst,"JPEG",quality=q,optimize=True)
          PY
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: dedil-b74-c582-proof
          path: |
            ops/proofs/dedil-b-r74
            ops/proofs/dedil-c-r582
          retention-days: 3
      - name: Commit proofs
        run: |
          set -euo pipefail
          git config user.name "ImpresaX Rendering Bot"
          git config user.email "rendering-bot@impresax.local"
          git add ops/proofs/dedil-b-r74 ops/proofs/dedil-c-r582
          git diff --cached --quiet || git commit -m "chore(render-v2): export DEDIL B74/C582 structural proofs"
          git push origin HEAD:rendering-v2-shadow
