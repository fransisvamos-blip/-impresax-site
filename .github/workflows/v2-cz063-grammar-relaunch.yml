name: V2 DEDIL R118 Perceptual Jury Relaunch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-cz063-grammar-relaunch.yml'
  workflow_dispatch:

jobs:
  relaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
      PACK_ID: 8595c9d2-9d53-424b-a660-82102b9db5b3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Relaunch DEDIL A on R117 authored flagship
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          ok=0
          for i in {1..20}; do
            code=$(curl -sS -o /tmp/relaunch.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data "{\"pack_id\":\"$PACK_ID\",\"variant_key\":\"A\",\"run_key\":\"r117-authored-15k-v2\",\"force\":true,\"reset_budget\":true,\"reason\":\"R117_AUTHORED_FLAGSHIP_UPGRADE\"}" \
              "$V2_URL/shadow/relaunch-variant" || true)
            echo "attempt=$i code=$code body=$(cat /tmp/relaunch.json 2>/dev/null || true)"
            if [ "$code" = "202" ] || [ "$code" = "200" ]; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" = "1" ] || exit 1
          jq -e '.ok == true' /tmp/relaunch.json >/dev/null
          jq -e '.ok == true and .variant_key == "A" and .workflow_instance_id != null' /tmp/relaunch.json >/dev/null
          echo "DEDIL A relaunched exclusively on R118_PERCEPTUAL_JURY_V1. Global queue remains untouched." >> "$GITHUB_STEP_SUMMARY"
