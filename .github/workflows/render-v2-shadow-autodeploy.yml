name: Rendering V2 Shadow Autodeploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-v2-shadow-autodeploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: rendering-v2-shadow-autodeploy
  cancel-in-progress: false

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
    steps:
      - name: Check credential gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${OPS_DATABASE_URL:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "V2 shadow autodeploy is armed but waiting for CLOUDFLARE_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: rendering-v2-shadow

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Validate V2 before deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          node --test test/render-v2*.test.mjs
          npx wrangler deploy --dry-run --config wrangler.render-v2.jsonc --outdir dist-v2

      - name: Ensure private R2 artifact bucket
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket list 2>/dev/null | grep -q 'impresax-render-v2-shadow'; then
            npx wrangler r2 bucket create impresax-render-v2-shadow
          fi

      - name: Deploy isolated V2 shadow
        if: steps.gate.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.render-v2.jsonc 2>&1 | tee /tmp/v2-deploy.log
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/v2-deploy.log | tail -1 || true)
          if [ -z "$url" ]; then
            echo "Unable to resolve the workers.dev URL from Wrangler output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install Neon runtime secret
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPS_DATABASE_URL" | npx wrangler secret put OPS_DATABASE_URL --config wrangler.render-v2.jsonc

      - name: Verify healthy V2 shadow
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          V2_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in {1..24}; do
            code=$(curl -L -sS -o /tmp/v2-health.json -w '%{http_code}' --connect-timeout 8 --max-time 15 "$V2_URL/healthz" || true)
            echo "attempt=$i code=$code body=$(cat /tmp/v2-health.json 2>/dev/null || true)"
            if [ "$code" = "200" ]               && grep -q '"mode":"SHADOW"' /tmp/v2-health.json               && grep -q '"engine":"RS_ENGINE_V2_1_HERO"' /tmp/v2-health.json               && grep -q '"database_connected":true' /tmp/v2-health.json               && grep -q '"hero_contract_required":true' /tmp/v2-health.json               && grep -q '"hero_db_guard":true' /tmp/v2-health.json               && grep -q '"hero_score_floor":8' /tmp/v2-health.json               && grep -q '"hero_certified_variants_required":3' /tmp/v2-health.json               && grep -q '"ai":true' /tmp/v2-health.json               && grep -q '"browser":true' /tmp/v2-health.json               && grep -q '"r2":true' /tmp/v2-health.json               && grep -q '"parent_workflow":true' /tmp/v2-health.json               && grep -q '"variant_workflow":true' /tmp/v2-health.json; then
              echo "V2_URL=$V2_URL" >> "$GITHUB_ENV"
              echo "V2 shadow is deployed and healthy. CZ-063 autostart is armed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "V2 shadow failed health validation."
          exit 1


      - name: Bootstrap and reconcile CZ-063
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          V2_URL: ${{ steps.deploy.outputs.url }}
          V2_CONTRACT_KEY: hero-v2i-20261014
        run: |
          set -euo pipefail
          token=$(printf '%s' "impresax-v2-control-v1:${CLOUDFLARE_API_TOKEN}" | sha256sum | awk '{print $1}')
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null

          started=0
          for i in {1..18}; do
            code=$(curl -sS -o /tmp/v2-start.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data '{"prospect_code":"CZ-063"}' \
              "$V2_URL/shadow/start" || true)
            echo "start_attempt=$i code=$code"
            if [ "$code" = "202" ]; then started=1; break; fi
            sleep 5
          done
          [ "$started" = "1" ] || { cat /tmp/v2-start.json || true; exit 1; }

          pack=$(jq -r '.pack_id // ""' /tmp/v2-start.json)
          instance=$(jq -r '.workflow_instance_id // ""' /tmp/v2-start.json)
          status=$(jq -r '.workflow_status.status // ""' /tmp/v2-start.json)
          output_status=$(jq -r '.workflow_status.output.status // ""' /tmp/v2-start.json)
          [ -n "$pack" ] || exit 1

          if { [ "$status" = "failed" ] || [ "$status" = "errored" ] || [ "$output_status" = "ESCALATION_REQUIRED" ] || [ "$output_status" = "INPUT_BLOCKED" ]; } && [ -n "$instance" ]; then
            payload=$(jq -nc --arg id "$instance" '{workflow_instance_id:$id,action:"restart"}')
            control_code=$(curl -sS -o /tmp/v2-control.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$V2_URL/shadow/control" || true)
            echo "parent_restart_code=$control_code"
            [ "$control_code" = "200" ] || { cat /tmp/v2-control.json || true; exit 1; }
          fi

          # Preserve the already-certified B route. Repair only A and C with the industrial documentary hero contract.
          for variant in A C; do
            reset=false
            if [ "$variant" = "A" ]; then reset=true; fi
            repair_key="$V2_CONTRACT_KEY-$variant"
            repair_payload=$(jq -nc \
              --arg pack "$pack" \
              --arg variant "$variant" \
              --arg key "$repair_key" \
              --argjson reset "$reset" \
              '{pack_id:$pack,variant_key:$variant,run_key:$key,force:true,reset_budget:$reset,reason:"ENGINE_CONTRACT_UPGRADE"}')
            repair_code=$(curl -sS -o "/tmp/v2-repair-$variant.json" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data "$repair_payload" \
              "$V2_URL/shadow/relaunch-variant" || true)
            echo "repair_variant=$variant code=$repair_code"
            if [ "$repair_code" != "200" ] && [ "$repair_code" != "202" ]; then
              cat "/tmp/v2-repair-$variant.json" || true
              exit 1
            fi
            jq -e '.ok == true' "/tmp/v2-repair-$variant.json" >/dev/null
          done
          echo "V2 HERO targeted repair: key=$V2_CONTRACT_KEY variants=A,C B=preserved" >> "$GITHUB_STEP_SUMMARY"

# HERO_CONTRACT_PATCH_6_FAST_SEED

# HERO_RAW_PREQA_V1

# HERO_PRODUCTION_MODEL_V1

# HERO_PREQA_EVIDENCE_V1

# HERO_FLUX2_DEV_V1

# HERO_INDUSTRIAL_TARGETED_REPAIR_V1

# HERO_C_PROCESS_ONLY_V1
