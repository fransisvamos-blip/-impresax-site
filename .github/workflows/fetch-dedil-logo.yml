name: Fetch DEDIL official logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-dedil-logo.yml"

permissions:
  contents: write

jobs:
  fetch-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact official logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/render-packs/CZ-063/v2
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 \
            "https://www.dedildonato.it/wp-content/uploads/2023/10/dedildonato-300x70.png" \
            -o ops/render-packs/CZ-063/v2/dedil-logo-official.png
          test -s ops/render-packs/CZ-063/v2/dedil-logo-official.png
          file ops/render-packs/CZ-063/v2/dedil-logo-official.png
      - name: Commit exact asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ImpresaX Rendering Studio"
          git config user.email "actions@users.noreply.github.com"
          git add ops/render-packs/CZ-063/v2/dedil-logo-official.png
          if git diff --cached --quiet; then
            echo "No asset change"
            exit 0
          fi
          git commit -m "Store exact DEDIL official logo asset"
          git push
