name: DEDIL V3 Reconcile

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-v3-reconcile.yml"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger isolated V2 reconcile
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/reconcile.json -w "%{http_code}" -X POST --connect-timeout 8 --max-time 30 "https://impresax-render-v2-shadow.fransisvamos.workers.dev/shadow/reconcile")
          cat /tmp/reconcile.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/reconcile.json
