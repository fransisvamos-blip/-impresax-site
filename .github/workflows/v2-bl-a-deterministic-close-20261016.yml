name: V2 B.L. A Deterministic Close 20261016

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-bl-a-deterministic-close-20261016.yml'
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
      PACK_ID: 959dffb2-48d0-40db-94bf-1802625fa47d
      RUN_KEY: bl-a-v3-deterministic-close-20261016
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deterministic relaunch B.L. A
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          body=$(jq -nc --arg pack "$PACK_ID" --arg key "$RUN_KEY"             '{pack_id:$pack,variant_key:"A",run_key:$key,force:false,reset_budget:true,event_prefix:"deterministic-close",reason:"ENGINE_CONTRACT_UPGRADE"}')
          code=$(curl -sS -o /tmp/relaunch.json -w '%{http_code}'             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             --data "$body"             "$V2_URL/shadow/relaunch-variant")
          cat /tmp/relaunch.json
          [ "$code" = "202" ] || [ "$code" = "200" ]
          jq -e '.ok == true and .pack_id == env.PACK_ID and .variant_key == "A"' /tmp/relaunch.json >/dev/null
