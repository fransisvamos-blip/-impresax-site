name: Gualtieri R112 SVG gate retry

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/gualtieri-r112-svg-gate-retry.yml"

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-7ba0aa4c-5598-4ef8-a81e-6d9fd4e03ced-A-r112-svg-gate-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deploy current R112 worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.render-v2.jsonc
      - name: Retry Gualtieri A with vector-aware browser gate
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"38a3796c-9c04-4b82-bcb4-e7bc3978769e","packId":"7ba0aa4c-5598-4ef8-a81e-6d9fd4e03ced","inputPackId":"7dfd4b2b-95f2-41ad-8ff9-1d47eb873d28","variantId":"90572c7a-b75c-479d-9593-7208ca4d6be5","variantKey":"A","parentInstanceId":"rpv2-7ba0aa4c-5598-4ef8-a81e-6d9fd4e03ced-r112-direct-v1","eventPrefix":"gualtieri-r112-svg-gate-v1","initialFeedback":{"reason":"DETERMINISTIC_HERO_RESOLUTION_FALLBACK","issues":["Use the scalable SVG hero fallback. Browser QA now treats vector artwork as resolution-independent.","Preserve the full R112 section-substance architecture."],"actions":["Retry A only.","Keep 4-6 strong Why Us reasons with proof support.","Keep two rich editorial feature scenes and sector-specific middle-scroll depth.","Keep bridge secondary-only and final CTA primary-only.","Do not spawn B or C.","Keep external AI disabled."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json
      - name: Wait for retry
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json > /tmp/status.json
            cat /tmp/status.json
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"complete"' /tmp/status.json; then exit 0; fi
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"(errored|terminated)"' /tmp/status.json; then exit 1; fi
            sleep 4
          done
          exit 1
