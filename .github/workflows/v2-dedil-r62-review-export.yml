name: V2 DEDIL R62 Review Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-dedil-r62-review-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Export DEDIL rev62 screenshots
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          mkdir -p review
          fetch_artifact() {
            local id="$1"
            local out="$2"
            local ok=0
            for i in {1..20}; do
              code=$(curl -sSL -o "$out" -w '%{http_code}' -H "Authorization: Bearer $token" "$V2_URL/shadow/artifact/$id" || true)
              echo "artifact=$id attempt=$i code=$code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              if [ "$code" != "401" ] && [ "$code" != "503" ]; then break; fi
              sleep 3
            done
            [ "$ok" = "1" ] || exit 1
          }
          fetch_artifact 3478a1d4-04e4-4d1a-b1e8-209a966c79f8 review/dedil-r62-desktop.jpg
          fetch_artifact 984cf536-a7bd-4fd8-a4d4-62dbff2f2140 review/dedil-r62-mobile.jpg
          file review/*
      - uses: actions/upload-artifact@v4
        with:
          name: dedil-r62-review
          path: review/
          if-no-files-found: error
