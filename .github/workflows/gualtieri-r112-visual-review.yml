name: Gualtieri R112 raster-first visual review

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/gualtieri-r112-visual-review.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Fetch raster-first R112 screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-104/7ba0aa4c-5598-4ef8-a81e-6d9fd4e03ced/A/r7/desktop-1440.jpg" --remote --file review/gualtieri-r112-desktop.jpg
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-104/7ba0aa4c-5598-4ef8-a81e-6d9fd4e03ced/A/r7/mobile-390.jpg" --remote --file review/gualtieri-r112-mobile.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: gualtieri-r112-raster-first-visual-review
          path: review/
          retention-days: 1
