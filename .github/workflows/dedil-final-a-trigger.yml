name: DEDIL final single-concept trigger

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-final-a-trigger.yml"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-8595c9d2-9d53-424b-a660-82102b9db5b3-A-final-contrast-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Trigger DEDIL final A
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"1695ca34-83ba-4752-998c-023702ceab42","packId":"8595c9d2-9d53-424b-a660-82102b9db5b3","inputPackId":"0db11b64-b638-4dff-90fd-41b132c309af","variantId":"1f5af9d8-c9a8-4659-b389-84b9cc7f528d","variantKey":"A","parentInstanceId":"rpv2-8595c9d2-9d53-424b-a660-82102b9db5b3","eventPrefix":"dedil-final-a","initialFeedback":{"reason":"ENGINE_CONTRACT_UPGRADE","issues":["Keep the Cabina-locked A hero.","Apply final high-contrast text treatment across every section."],"actions":["Use hero SHA 3198e1907e6dd3efc0b2720bad3a28769dffb1853703257ba510d218e96a1430.","Keep one concept only.","Apply premium section polish and contrast guards.","Keep external AI disabled."]}}'
          set +e
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json > /tmp/trigger.json 2>&1
          rc=$?
          set -e
          cat /tmp/trigger.json
          if [ "$rc" -ne 0 ] && ! grep -q "already_exists" /tmp/trigger.json; then exit "$rc"; fi
      - name: Wait for final render
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..70}; do
            npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json > /tmp/status.json
            cat /tmp/status.json
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"complete"' /tmp/status.json; then exit 0; fi
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"(errored|terminated)"' /tmp/status.json; then exit 1; fi
            sleep 4
          done
          exit 1
