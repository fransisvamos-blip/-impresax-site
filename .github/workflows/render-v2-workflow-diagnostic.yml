name: Rendering V2 R122 Desire Pilot V13

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'

jobs:
  launch-r122-kipoint-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-r122-desire-v13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - name: Launch KiPoint R122 v13
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122v13","runKey":"kipoint-r122-v13","initialFeedback":{"reason":"R122_DESIRE_ENGINE_HARD_RESET","issues":["V12 still tried to literalize Point despite the CTA-polarity strategy."],"actions":["Treat Point/Hub/Node/Link/Axis/Center as branding only, never as campaign semantics or geometry.","Make the verified BEFORE_AFTER_SERVICE CTA polarity primary: quotation/choice before service, tracking/visibility after movement.","Build the visual story from atomic service states, Catanzaro context and verified proof without maps, routes, grids, markers or dashboard metaphors.","Proof stays outside imagery; six media grammars remain distinct.","If concept passes, continue through six campaign assets, compile, desktop/mobile capture and final sellability jury."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
