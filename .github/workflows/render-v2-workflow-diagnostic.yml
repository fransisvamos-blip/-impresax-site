name: Rendering V2 Visual Design 6 Rework Wave 2

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  launch-visual-design-rework-wave-2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      VARIANT_WORKFLOW: impresax-render-v2-variant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Relaunch adaptive-evidence rework wave
        shell: bash
        run: |
          set -euo pipefail

          trigger_variant () {
            local instance="$1" prospect="$2" pack="$3" input="$4" variant="$5" parent="$6"
            local params
            params=$(printf '{"prospectId":"%s","packId":"%s","inputPackId":"%s","variantId":"%s","variantKey":"A","parentInstanceId":"%s","eventPrefix":"visual6b","initialFeedback":{"reason":"ENGINE_CONTRACT_UPGRADE","issues":["Rework under adaptive evidence gates after compiler correction."],"actions":["Use only verified services, trust facts, identity and assets actually available.","Do not fabricate missing services or trust reasons.","Use the current premium rendering and responsive contract.","Produce desktop 1440 and mobile 390 previews.","Keep human review hold; no auto approval."]}}' "$prospect" "$pack" "$input" "$variant" "$parent")
            npx wrangler workflows trigger "$VARIANT_WORKFLOW" "$params" --id "$instance" --json --config wrangler.render-v2.jsonc
          }

          trigger_variant             "rv2-5c099137-a7fc-484f-855f-69a2b5ed387d-A-visual6-v2"             "91350cbb-fc69-4bc0-abfc-886f2d306da1"             "5c099137-a7fc-484f-855f-69a2b5ed387d"             "ce21b177-562e-40b2-9443-67c5be6102c5"             "ffdfe59c-9b28-4c2c-b745-bf90301b041e"             "rpv2-5c099137-a7fc-484f-855f-69a2b5ed387d"

          trigger_variant             "rv2-d664069c-c51b-4248-8673-2c28b943b591-A-visual6-v2"             "4ca88af3-0e41-41dc-aed0-4dd3118d2486"             "d664069c-c51b-4248-8673-2c28b943b591"             "61286c99-1725-4305-a4cf-ce43dc7073cb"             "7e9594be-e0a3-49f0-a085-63b95257ca25"             "rpv2-d664069c-c51b-4248-8673-2c28b943b591"

          trigger_variant             "rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-visual6-v2"             "0e5c7a2c-5fd8-48e1-ae71-6f9beff73735"             "beac207a-da17-436d-afdf-cfc5caff7727"             "ff343ba2-33b1-41fa-b4c0-9c3202b4d406"             "f342e900-e895-4970-8a72-bed745825e42"             "rpv2-beac207a-da17-436d-afdf-cfc5caff7727"
