name: Rendering V2 R122 Desire Pilot

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  launch-r122-kipoint-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-r122-desire-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Launch KiPoint R122 Desire Engine pilot
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122","runKey":"kipoint-r122-v1","initialFeedback":{"reason":"R122_DESIRE_ENGINE_HARD_RESET","issues":["Previous render lacked strong imagery, premium CTA authority and EUR 15k+ perceived value."],"actions":["Hard reset the visual concept; do not reuse the previous layout skeleton.","Derive visual geometry, color tension, shell and CTA language from the official logo and verified brand DNA.","Generate and use the six distinct R121 campaign assets as a coherent editorial visual world.","Create at least three unmistakable wow moments, premium navigation, a conversion-object final CTA and a campaign-level footer.","Mobile must be independently re-authored at 390px.","Do not invent business facts or documentary claims."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" \
            --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/trigger.json
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/status.json
