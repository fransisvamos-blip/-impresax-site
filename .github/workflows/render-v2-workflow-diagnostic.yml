name: Rendering V2 R122 Desire Pilot V16

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'

jobs:
  launch-r122-kipoint-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-r122-desire-v16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - name: Launch KiPoint R122 v16
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122v16","runKey":"kipoint-r122-v16","initialFeedback":{"reason":"R122_DESIRE_ENGINE_ROLE_AWARE_OWNABILITY","issues":["Previous precheck incorrectly required proof to behave like imagery and produced a false CUT process warning from art-direction language."],"actions":["Use deterministic business-derived kernel.","Treat locality as environmental context beat and proof as HTML decision architecture adjacent to imagery.","Judge unverified process language only in literal operational depiction, not crop/art-direction terminology.","Keep service states parallel; do not invent a logistics sequence.","If concept passes 8.0/8.3 pre-production gate, continue automatically through six assets, render and final 9.5/9.7 screenshot jury.","Do not touch any other prospect."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
