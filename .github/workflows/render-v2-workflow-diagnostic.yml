name: Rendering V2 R122 Production V26

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  launch-kipoint-v26:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-r122-desire-v26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - name: Launch KiPoint R122 V26 targeted sellability repair
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentRevisionId":"b3e6ab19-bf2f-4a9a-b2d5-e5ca254d02b7","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122v26","runKey":"kipoint-r122-v26-trust-imagery-repair","initialFeedback":{"reason":"R122_R11_TARGETED_SELLABILITY_REPAIR","issues":["r11 reached 6.5 but failed for trust section collision on desktop, unreadable vertical proof columns on mobile, repeated courtyard imagery between hero and Profilo aziendale, and possible off-identity CGI color."],"actions":["Start from r7 as the clean structural parent; preserve all four compiler copy contracts.","Use the rebuilt nested trust rail: no ghost grid columns, no mid-word breaks, readable proof rows on desktop and 390 mobile.","Use R121_ATMOSPHERE as the Profilo aziendale visual and move R121_SCALE to a dark, cropped, monochrome locality fragment later in the story so the hero courtyard is not repeated as a second full scene.","Neutralize the suspect R121_STRUCTURE CGI color without regenerating the approved asset.","Reuse the six approved R121 assets; do not regenerate concept or assets.","Capture desktop 1440 and mobile 390, then run strict visual QA and R122 sellability jury. Keep global queue OFF and do not mutate other prospects."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/trigger.json
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/status.json
