name: Rendering V2 Visual Design Genovese Final

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  launch-genovese-final:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      VARIANT_WORKFLOW: impresax-render-v2-variant
      INSTANCE_ID: rv2-c40ab9ed-afcd-493e-bb94-a25b7ad20792-A-visual6-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Launch Genovese final corrected render
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"5bb7fc6b-a741-4c9e-91b8-b48a2e09f193","packId":"c40ab9ed-afcd-493e-bb94-a25b7ad20792","inputPackId":"a13405b1-bdad-45ec-891c-de1f0ad6b66d","variantId":"2f13aafd-535c-449c-8517-844cbee37c13","variantKey":"A","parentInstanceId":"rpv2-c40ab9ed-afcd-493e-bb94-a25b7ad20792","eventPrefix":"visual6d","initialFeedback":{"reason":"ENGINE_CONTRACT_UPGRADE","issues":["VAT identifier was incorrectly classified as contact data; classification is now corrected."],"actions":["Render all verified non-contact trust proofs including P.IVA as company evidence, not as a telephone number.","Use only verified services, contacts, identity and assets.","Produce desktop 1440 and mobile 390 previews.","Keep human review hold; no auto approval."]}}'
          npx wrangler workflows trigger "$VARIANT_WORKFLOW" "$PARAMS" --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
