name: Rendering V2 R122 Desire Pilot V2

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  launch-r122-kipoint-pilot-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-r122-desire-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Launch corrected KiPoint R122 pilot v2
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122v2","runKey":"kipoint-r122-v2","initialFeedback":{"reason":"R122_DESIRE_ENGINE_HARD_RESET","issues":["Previous R122 attempt was terminated because an internal normalizer contaminated KiPoint with DEDIL/construction-specific visual language."],"actions":["Start from verified KiPoint data and official identity only.","Derive concept, visual geometry, color tension, premium shell and CTA language from KiPoint logo/brand DNA and verified postal/logistics service context.","Use all six campaign assets with genuinely distinct visual modes; no construction material, reinforcing steel, DEDIL or Germaneto references.","Create at least three portfolio-grade wow moments, premium menu, final conversion object and authored footer.","Mobile is a distinct 390px composition.","No unverified endorsements, premises, fleet, people, process details or documentary claims."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" \
            --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/trigger.json
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/status.json
