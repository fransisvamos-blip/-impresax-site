name: Rendering V2 Visual Design Final Pair

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  launch-final-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      VARIANT_WORKFLOW: impresax-render-v2-variant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Launch Genovese and Gulli final visual reworks
        shell: bash
        run: |
          set -euo pipefail

          GENOVESE='{"prospectId":"5bb7fc6b-a741-4c9e-91b8-b48a2e09f193","packId":"c40ab9ed-afcd-493e-bb94-a25b7ad20792","inputPackId":"a13405b1-bdad-45ec-891c-de1f0ad6b66d","variantId":"2f13aafd-535c-449c-8517-844cbee37c13","variantKey":"A","parentInstanceId":"rpv2-c40ab9ed-afcd-493e-bb94-a25b7ad20792","eventPrefix":"visual6c","initialFeedback":{"reason":"ENGINE_CONTRACT_UPGRADE","issues":["Trust proof gates now distinguish actual proof from contact details."],"actions":["Use only verified non-contact trust proof.","Use only verified services, contacts, identity and assets.","Produce desktop 1440 and mobile 390 previews.","Keep human review hold; no auto approval."]}}'
          GULLI='{"prospectId":"6cd5f965-92c6-48a6-bd69-ff45e678639f","packId":"5e5bb714-cc4b-4935-bbba-8c38b997be12","inputPackId":"3f9262e3-efb2-46fb-8dca-da003d8cfcfd","variantId":"fe5002aa-d21b-47c7-af8d-5b751077ee6e","variantKey":"A","parentInstanceId":"rpv2-queue-5e5bb714-cc4b-4935-bbba-8c38b997be12-3","eventPrefix":"visual6c","initialFeedback":{"reason":"ENGINE_CONTRACT_UPGRADE","issues":["Contact details are no longer counted as trust proof."],"actions":["Render the two actual non-contact trust proofs available.","Use only verified services, contacts, identity and assets.","Produce desktop 1440 and mobile 390 previews.","Keep human review hold; no auto approval."]}}'

          npx wrangler workflows trigger "$VARIANT_WORKFLOW" "$GENOVESE"             --id "rv2-c40ab9ed-afcd-493e-bb94-a25b7ad20792-A-visual6-v2"             --json --config wrangler.render-v2.jsonc
          npx wrangler workflows trigger "$VARIANT_WORKFLOW" "$GULLI"             --id "rv2-5e5bb714-cc4b-4935-bbba-8c38b997be12-A-visual6-v3"             --json --config wrangler.render-v2.jsonc
