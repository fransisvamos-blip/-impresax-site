name: Rendering V2 Workflow Diagnostic

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  ensure-v22:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-38441f16-d2ff-48bb-bdc1-3520230548b9-A-dedil-r121-creative-director-v22
    steps:
      - name: Ensure v22 exists in Cloudflare Workflows
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/$WORKFLOW_NAME/instances"
          code=$(curl -sS -o /tmp/get.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" "$base/$INSTANCE_ID?simple=true")
          if [ "$code" = "404" ]; then
            python - <<'PY'
          import json, os
          params={
            "prospectId":"1695ca34-83ba-4752-998c-023702ceab42",
            "packId":"38441f16-d2ff-48bb-bdc1-3520230548b9",
            "inputPackId":"01a3d875-3007-4962-8fd4-a453e8fca48f",
            "variantId":"23d69d20-3b20-4fd1-8ba4-e61f2a64f17c",
            "variantKey":"A",
            "parentInstanceId":"rpv2-38441f16-d2ff-48bb-bdc1-3520230548b9-dedil-plan-r119-v14",
            "eventPrefix":"r121",
            "initialFeedback":{
              "reason":"R121_CREATIVE_DIRECTOR_ENGINE_V1",
              "issues":["Cabina requested a genuinely new flagship composition for the locked pilot only."],
              "actions":[
                "Run the R121 Creative Director Engine: concept lock before code, coherent campaign asset system, concept-driven implementation and live interactive preview.",
                "Preserve DEDIL verified truth, verified partner proof and official identity; generated campaign imagery is illustrative, never documentary proof.",
                "Treat desktop and mobile as separately art-directed expressions of the same locked campaign.",
                "Do not start or mutate any other prospect."
              ]
            }
          }
          body={"instance_id":os.environ["INSTANCE_ID"],"params":json.dumps(params,separators=(",",":"))}
          with open("/tmp/create.json","w") as fh: json.dump(body,fh,separators=(",",":"))
          PY
            create_code=$(curl -sS -o /tmp/create-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/create.json "$base")
            echo "create_http_status=$create_code"
            python - <<'PY'
          import json
          d=json.load(open("/tmp/create-response.json"))
          r=d.get("result") or {}
          print("create_success=",d.get("success"))
          print("instance_id=",r.get("id"))
          print("status=",r.get("status"))
          print("version_id=",r.get("version_id"))
          print("trigger_source=",r.get("trigger_source"))
          if not d.get("success"): print("api_errors=",d.get("errors"))
          PY
            test "$create_code" = "200"
          elif [ "$code" = "200" ]; then
            echo "instance_already_exists=true"
          else
            cat /tmp/get.json
            exit 1
          fi

          sleep 5
          final_code=$(curl -sS -o /tmp/final.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" "$base/$INSTANCE_ID?simple=true")
          echo "final_http_status=$final_code"
          python - <<'PY'
          import json
          d=json.load(open("/tmp/final.json"))
          r=d.get("result") or {}
          e=r.get("error") or {}
          print("final_success=",d.get("success"))
          print("final_status=",r.get("status"))
          print("started_on=",r.get("started_on"))
          print("modified_on=",r.get("modified_on"))
          print("error_name=",e.get("name") if isinstance(e,dict) else "")
          print("error_message=",e.get("message") if isinstance(e,dict) else "")
          if not d.get("success"): print("api_errors=",d.get("errors"))
          PY
          test "$final_code" = "200"
