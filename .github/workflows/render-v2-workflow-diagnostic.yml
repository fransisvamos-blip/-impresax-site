name: Rendering V2 R122 Desire Pilot V14

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'

jobs:
  launch-r122-kipoint-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-r122-desire-v14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - name: Launch KiPoint R122 v14 deterministic-kernel pilot
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122v14","runKey":"kipoint-r122-v14","initialFeedback":{"reason":"R122_DESIRE_ENGINE_DETERMINISTIC_KERNEL","issues":["Previous attempts spent too much creative budget inventing and rejecting generic campaign mechanisms before any render existed."],"actions":["Use the deterministic business-derived kernel as authoritative; do not invent a different metaphor or process sequence.","Treat verified services as parallel service states, not an inferred workflow.","Use six materially distinct visual modes with at least four tied to different verified service states.","Keep locality and proof in dedicated environmental/HTML evidence roles, not embedded in generated imagery.","Create premium navigation, campaign hero, three wow moments, authored conversion-object CTA, integrated footer and independently re-authored mobile.","The concept gate is pre-production only; the final screenshot sellability gate remains 9.5/9.7."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
