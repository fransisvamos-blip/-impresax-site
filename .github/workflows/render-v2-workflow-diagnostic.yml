      - run: npm install --no-audit --no-fund
      - name: Launch KiPoint R122 V27 mobile art-direction repair
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentRevisionId":"b3e6ab19-bf2f-4a9a-b2d5-e5ca254d02b7","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122v27","runKey":"kipoint-r122-v27-mobile-art-direction","initialFeedback":{"reason":"R122_R13_TARGETED_MOBILE_AND_CONTRAST_REPAIR","issues":["r13 trust collision is solved, but Profilo aziendale has low contrast, Contatto diretto still reads as repeated hero environment, and mobile is perceived as compressed desktop with proof too late."],"actions":["Start from r7 clean structural parent and preserve all compiler contracts.","Use luminous high-contrast R121_ATMOSPHERE for Profilo aziendale with authored dark copy panel and official accent edge.","Keep R121_SCALE only as a highly zoomed, blurred, monochrome material trace at the bottom of Contatto diretto, never as a second environmental scene.","On 390 mobile use a distinct section order: hero, positioning with verified proof at beat two, trust, bridge, services, offer architecture, verified operation, final CTA.","Do not repeat TRUST_1 later on mobile after it has been surfaced at beat two.","Remove mobile hero zoom that can soften the source image.","Reuse all six approved campaign assets, do not regenerate concept/assets, keep queue OFF and do not mutate any other prospect.","Capture desktop 1440 and mobile 390 and run strict R122 sellability jury."]}}'
