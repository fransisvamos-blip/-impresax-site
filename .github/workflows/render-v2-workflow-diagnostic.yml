name: Rendering V2 Final Conversion Launch

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'
  workflow_dispatch:

jobs:
  launch-dedil-final-conversion-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-38441f16-d2ff-48bb-bdc1-3520230548b9-A-dedil-final-conversion-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Launch DEDIL Final Conversion Object V1
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"1695ca34-83ba-4752-998c-023702ceab42","packId":"38441f16-d2ff-48bb-bdc1-3520230548b9","inputPackId":"01a3d875-3007-4962-8fd4-a453e8fca48f","variantId":"23d69d20-3b20-4fd1-8ba4-e61f2a64f17c","variantKey":"A","parentInstanceId":"rpv2-38441f16-d2ff-48bb-bdc1-3520230548b9-dedil-plan-r119-v14","eventPrefix":"cabina","initialFeedback":{"reason":"CABINA_PRECOMPUTED_RENDER","issues":["The final quote CTA is still visually generic and oversized."],"actions":["Use the current Cabina precomputed DEDIL composition.","Keep IMPRESAX_ICONOGRAPHY_V2 and IMPRESAX_PREMIUM_ELEMENTS_V1.","Apply IMPRESAX_FINAL_CONVERSION_OBJECT_V1 to the final quote CTA.","Final CTA must be controlled-width, asymmetric, with a dedicated action module, brand rail and directional control.","Forbid generic full-width white slabs.","Preserve verified content, imagery and official identity.","Do not start or mutate any other prospect."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" \
            --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/trigger.json
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc | tee /tmp/status.json
