name: Rendering V2 R122 Desire Pilot V9

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - '.github/workflows/render-v2-workflow-diagnostic.yml'

jobs:
  launch-r122-kipoint-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-beac207a-da17-436d-afdf-cfc5caff7727-A-r122-desire-v9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - name: Launch KiPoint R122 v9
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"0e5c7a2c-5fd8-48e1-ae71-6f9beff73735","packId":"beac207a-da17-436d-afdf-cfc5caff7727","inputPackId":"ff343ba2-33b1-41fa-b4c0-9c3202b4d406","variantId":"f342e900-e895-4970-8a72-bed745825e42","variantKey":"A","parentInstanceId":"rpv2-beac207a-da17-436d-afdf-cfc5caff7727","eventPrefix":"r122v9","runKey":"kipoint-r122-v9","initialFeedback":{"reason":"R122_DESIRE_ENGINE_HARD_RESET","issues":["V8 reached the concept jury but failed only because locality removal consequences were under-explained."],"actions":["Use the deterministic ownability map with fully load-bearing OPERATION, LOCALITY, PROOF and literal-brand-semantic consequences.","Keep the atomic service-state choreography and Point semantic from V8.","At least four of six campaign assets must embody distinct verified service states.","Make Catanzaro locality and verified MIMIT/rating proof materially affect story and conversion sequencing.","No generic wrapper metaphors. No fake fleet, premises, staff, equipment, endorsements or documentary imagery.","Proceed to campaign assets and rendering only if the hostile concept jury passes."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
          sleep 8
          npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --json --config wrangler.render-v2.jsonc
