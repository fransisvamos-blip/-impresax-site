name: ImpresaX Ops Force Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-force-production-deploy-20261017.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deploy ImpresaX production Worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify live pilot UI
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            code=$(curl -L -sS -o /tmp/render-ui.js -w '%{http_code}' --connect-timeout 8 --max-time 20 https://impresax.org/admin/render-variants.js || true)
            health=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 8 --max-time 20 https://admin.impresax.org/ops/healthz || true)
            echo "attempt=$i ui=$code health=$health"
            if [ "$code" = "200" ]               && grep -q 'PILOT PRONTO' /tmp/render-ui.js               && grep -q 'render_v2_pilot_candidate' /tmp/render-ui.js               && [ "$health" = "200" ]; then
              exit 0
            fi
            sleep 4
          done
          echo "--- render ui ---"
          head -c 2000 /tmp/render-ui.js || true
          echo
          echo "--- health ---"
          cat /tmp/health.json || true
          exit 1

