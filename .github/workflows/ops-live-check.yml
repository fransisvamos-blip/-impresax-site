name: ImpresaX Ops Live Check

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/admin/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/ops-live-check.yml"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for Cloudflare production deployment
        shell: bash
        run: |
          set -euo pipefail
          health="https://admin.impresax.org/ops/healthz"
          for i in {1..24}; do
            code=$(curl -L -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 8 --max-time 15 "$health" || true)
            echo "attempt=$i code=$code body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] \
              && grep -q '"database_connected":true' /tmp/health.json \
              && grep -q '"render_pipeline":"CLOUDFLARE_NATIVE_V1"' /tmp/health.json \
              && grep -q '"render_model":"@cf/zai-org/glm-4.7-flash"' /tmp/health.json \
              && grep -q '"render_engine_version":"CLOUDFLARE_NATIVE_V8_3_CREATIVE_QUALITY"' /tmp/health.json \
              && grep -q '"frozen_master_commit":"9578da3fa1b173283bf5c748b0e7d89497537e76"' /tmp/health.json \
              && grep -q '"frozen_contract":"RENDERING_STUDIO_V1_FROZEN"' /tmp/health.json \
              && grep -q '"frozen_runtime_revision":"V8.3_DETERMINISTIC_SIX_VIEW_QA_20261013"' /tmp/health.json \
              && grep -q '"creative_engine_revision":"V8.3.2_ASSET_VISION_DEDUPED_PRE_RENDER_EVIDENCE"' /tmp/health.json \
              && grep -q '"frozen_db_guard":true' /tmp/health.json \
              && grep -q '"frozen_db_guard_current":true' /tmp/health.json \
              && grep -q '"exact_brand_dna_required":true' /tmp/health.json \
              && grep -q '"image_provenance_required":true' /tmp/health.json \
              && grep -q '"site_factory_reference_lock_required":true' /tmp/health.json \
              && grep -q '"direction_pool_required":true' /tmp/health.json \
              && grep -q '"direction_set_gate_required":true' /tmp/health.json \
              && grep -q '"semantic_copy_gate_required":true' /tmp/health.json \
              && grep -q '"pre_render_evidence_required":true' /tmp/health.json \
              && grep -q '"creative_strategy_evidence_required":true' /tmp/health.json \
              && grep -q '"structured_asset_inventory_required":true' /tmp/health.json \
              && grep -q '"asset_vision_gate_required":true' /tmp/health.json \
              && grep -q '"cross_variant_visual_qa_required":true' /tmp/health.json \
              && grep -q '"qa_rework_memory_required":true' /tmp/health.json \
              && grep -q '"deterministic_browser_qa_required":true' /tmp/health.json \
              && grep -q '"six_view_set_qa_required":true' /tmp/health.json \
              && grep -q '"visual_asset_inventory_memory_required":true' /tmp/health.json \
              && grep -q '"flagship_first_pass_model":"@cf/openai/gpt-oss-120b"' /tmp/health.json \
              && grep -q '"generation_circuit_breaker_required":true' /tmp/health.json \
              && grep -q '"max_generation_failures":3' /tmp/health.json \
              && grep -q '"cron_heavy_phase_separation_required":true' /tmp/health.json \
              && grep -q '"ai_stale_recovery_minutes":16' /tmp/health.json \
              && grep -q '"cloudflare_cron_duration_limit_minutes":15' /tmp/health.json \
              && grep -q '"render_owner":"CLOUDFLARE_NATIVE_ONLY"' /tmp/health.json \
              && grep -q '"brand_gate_required":true' /tmp/health.json \
              && grep -q '"brand_gate_auto_recovery":true' /tmp/health.json \
              && grep -q '"visual_qa_required":true' /tmp/health.json \
              && grep -q '"visual_qa_model":"@cf/qwen/qwen3.8-27b"' /tmp/health.json \
              && grep -q '"render_selection_mode":"TWO_STEP_EXPLICIT"' /tmp/health.json \
              && grep -q '"render_ui_two_step":true' /tmp/health.json \
              && grep -q '"legacy_render_transports":"DISABLED"' /tmp/health.json \
              && grep -q '"false_render_ready_count":0' /tmp/health.json \
              && grep -q '"legacy_render_queue_active":0' /tmp/health.json \
              && grep -q '"ai_binding":true' /tmp/health.json \
              && grep -q '"browser_binding":true' /tmp/health.json; then
              exit 0
            fi
            sleep 5
          done
          echo "ImpresaX Ops health check did not become healthy."
          exit 1

      - name: Verify Control Room remains private
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/admin-body -D /tmp/admin-headers -w "%{http_code}" --connect-timeout 8 --max-time 15 "https://admin.impresax.org/" || true)
          echo "admin_code=$code"
          cat /tmp/admin-headers
          test "$code" = "401"
          grep -qi "WWW-Authenticate: Basic" /tmp/admin-headers
          grep -qi "X-Robots-Tag: noindex" /tmp/admin-headers

      - name: Verify public production has no regression
        shell: bash
        run: |
          set -euo pipefail
          root=$(curl -L -sS -o /tmp/root -w "%{http_code}" --connect-timeout 8 --max-time 15 "https://impresax.org/")
          pilot=$(curl -L -sS -o /tmp/pilot -w "%{http_code}" --connect-timeout 8 --max-time 15 "https://studiodentisticogiardinelli.impresax.org/")
          echo "root=$root pilot=$pilot"
          test "$root" = "200"
          test "$pilot" = "200"
          grep -qi "ImpresaX" /tmp/root
          grep -qi "Giardinelli" /tmp/pilot
          grep -qi "noindex" /tmp/pilot

# CLOUDFLARE_NATIVE_RENDER_VERIFY_V1
