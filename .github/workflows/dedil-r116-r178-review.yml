name: DEDIL R116 rev178 review

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-r116-r178-review.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Fetch DEDIL R116 rev178 screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/A/r178/desktop-1440.jpg" --remote --file review/dedil-r116-r178-desktop.jpg
          npx wrangler r2 object get "impresax-render-v2-shadow/render-v2/CZ-063/8595c9d2-9d53-424b-a660-82102b9db5b3/A/r178/mobile-390.jpg" --remote --file review/dedil-r116-r178-mobile.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: dedil-r116-r178-review
          path: review/
          retention-days: 1
