name: V2 CZ063 C Editorial V18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-cz063-c-editorial-v17.yml'
  workflow_dispatch:

jobs:
  relaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      V2_URL: https://impresax-render-v2-shadow.fransisvamos.workers.dev
      PACK_ID: 8595c9d2-9d53-424b-a660-82102b9db5b3
      FINALIZER_ID: rpv2-finalize-8595c9d2-9d53-424b-a660-82102b9db5b3-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendering-v2-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Replace C set1 with editorial ledger grammar
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put V2_SHADOW_TOKEN --config wrangler.render-v2.jsonc >/dev/null
          ok=0
          for i in {1..20}; do
            code=$(curl -sS -o /tmp/relaunch-c.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              --data "{\"pack_id\":\"$PACK_ID\",\"variant_key\":\"C\",\"run_key\":\"editorial-v18-c\",\"force\":true,\"event_prefix\":\"set1\",\"parent_workflow_instance_id\":\"$FINALIZER_ID\",\"reason\":\"SET_DIVERSITY_EDITORIAL_REBUILD\"}" \
              "$V2_URL/shadow/relaunch-variant" || true)
            echo "attempt=$i code=$code body=$(cat /tmp/relaunch-c.json 2>/dev/null || true)"
            if [ "$code" = "202" ] || [ "$code" = "200" ]; then ok=1; break; fi
            sleep 4
          done
          [ "$ok" = "1" ] || exit 1
          jq -e '.ok == true and .event_prefix == "set1"' /tmp/relaunch-c.json >/dev/null
          echo "C set1 rerun with resilient vision QA; A/B preserved." >> "$GITHUB_STEP_SUMMARY"
