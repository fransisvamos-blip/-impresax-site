name: DEDIL R109 direct deploy and render

on:
  push:
    branches: [rendering-v2-shadow]
    paths:
      - ".github/workflows/dedil-r108-direct-deploy-render.yml"

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: feca9a311477f890b71cf1116f1d6273
      OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
      WORKFLOW_NAME: impresax-render-v2-variant
      INSTANCE_ID: rv2-8595c9d2-9d53-424b-a660-82102b9db5b3-A-r109-15k-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Deploy latest R108 worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.render-v2.jsonc
          printf '%s' "$OPS_DATABASE_URL" | npx wrangler secret put OPS_DATABASE_URL --config wrangler.render-v2.jsonc
      - name: Trigger DEDIL R108 final
        shell: bash
        run: |
          set -euo pipefail
          PARAMS='{"prospectId":"1695ca34-83ba-4752-998c-023702ceab42","packId":"8595c9d2-9d53-424b-a660-82102b9db5b3","inputPackId":"0db11b64-b638-4dff-90fd-41b132c309af","variantId":"1f5af9d8-c9a8-4659-b389-84b9cc7f528d","variantKey":"A","parentInstanceId":"rpv2-8595c9d2-9d53-424b-a660-82102b9db5b3","eventPrefix":"dedil-r109-v1","initialFeedback":{"reason":"ENGINE_CONTRACT_UPGRADE","issues":["R109 15K art-direction gate.","Keep Cabina-locked approved hero.","Uniform service rows, anchored imagery, complete trust section, separate partner proof.","All sections must pass premium geometry, contrast, saturation and semantic coherence."],"actions":["Prefer no visual over a wrong visual.","One section equals one semantic message, one coherent visual system and locked grid.","Keep the approved hero unchanged.","Apply blocking contrast, saturation and premium polish globally.","Keep external AI disabled."]}}'
          npx wrangler workflows trigger "$WORKFLOW_NAME" "$PARAMS" --id "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json
      - name: Wait for DEDIL R108 final
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            npx wrangler workflows instances describe "$WORKFLOW_NAME" "$INSTANCE_ID" --config wrangler.render-v2.jsonc --json > /tmp/status.json
            cat /tmp/status.json
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"complete"' /tmp/status.json; then exit 0; fi
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"(errored|terminated)"' /tmp/status.json; then exit 1; fi
            sleep 4
          done
          exit 1
